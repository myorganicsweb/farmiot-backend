<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmIOT Field Debug</title>
  <style>
    body {
      background: #1a1a1a;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 20px; color: #fff; }
    .box {
      background: #222;
      border: 1px solid #444;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    .label { color: #888; font-size: 12px; text-transform: uppercase; }
    .value { font-size: 28px; font-weight: bold; margin: 5px 0; }
    .good { color: #4CAF50; }
    .bad { color: #f44336; }
    .row { display: flex; justify-content: space-between; }
    .log { 
      background: #111; 
      padding: 10px; 
      border-radius: 6px; 
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #333;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>🌱 FarmIOT Field Debug</h1>

  <div class="box">
    <div class="label">ESP32 Hub Status</div>
    <div class="value" id="statusBadge" class="bad">● OFFLINE</div>
  </div>

  <div class="box">
    <div class="label">📡 Last Data Received (Raw)</div>
    <div class="value" id="soilRaw">---</div>
  </div>

  <div class="box">
    <div class="label">📊 Soil Moisture %</div>
    <div class="value" id="soilPercent">---%</div>
  </div>

  <div class="box">
    <div class="row">
      <span class="label">⏱️ Last Update</span>
      <span class="label" id="timestamp">---</span>
    </div>
  </div>

  <div class="box" style="border-color: #555;">
    <div class="label">📋 Live Event Log</div>
    <div class="log" id="logArea">Waiting for data...</div>
  </div>

  <script>
    const logArea = document.getElementById('logArea');

    function addLog(msg) {
      const time = new Date().toLocaleTimeString();
      logArea.innerHTML = `[${time}] ${msg}\n` + logArea.innerHTML;
      if (logArea.children.length > 50) logArea.innerHTML = logArea.innerHTML.slice(0, 2000);
    }

    async function poll() {
      try {
        const res = await fetch('/api/esp32/soil');
        if (!res.ok) throw new Error('Offline');

        const data = await res.json();
        const raw = data.moisture || 0;
        const percent = Math.min(100, Math.max(0, (1 - (raw / 4095)) * 100));

        document.getElementById('soilRaw').innerText = raw;
        document.getElementById('soilPercent').innerText = percent.toFixed(0) + '%';
        document.getElementById('timestamp').innerText = new Date().toLocaleTimeString();

        const badge = document.getElementById('statusBadge');
        badge.innerText = '● ONLINE';
        badge.className = 'value good';

        addLog(`📡 Soil: ${raw} (${percent.toFixed(0)}%)`);

      } catch (err) {
        document.getElementById('statusBadge').innerText = '● OFFLINE';
        document.getElementById('statusBadge').className = 'value bad';
        addLog('❌ No signal from ESP32');
      }
    }

    setInterval(poll, 3000);
    poll();
  </script>
</body>
</html>

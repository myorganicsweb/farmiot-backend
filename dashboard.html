<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmIOT</title>
    <style>
        /* ... existing styles ... */
    </style>
</head>
<body>
    <!-- ... existing HTML ... -->

    <div class="card" id="discoveryCard" style="display:none;">
        <div class="card-header">
            <h2>🔍 Discovered Hubs</h2>
            <button class="btn btn-secondary" onclick="scanForHubs()">🔄 Scan Again</button>
        </div>
        <div id="discoveryList">
            <div class="loading">Scanning...</div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let token = localStorage.getItem('token') || null;
        let user = JSON.parse(localStorage.getItem('user') || 'null');
        let currentConfigHubId = null;
        let currentBleDevice = null;
        let currentBleCharacteristic = null;

        // BLE Config - MATCH ESP32
        const BLE_SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const BLE_CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ==========================================
        // BLE DISCOVERY - SCAN FOR HUBS
        // ==========================================
        async function scanForHubs() {
            const card = document.getElementById('discoveryCard');
            const list = document.getElementById('discoveryList');
            card.style.display = 'block';
            list.innerHTML = '<div class="loading"><div class="spinner"></div>Scanning for BLE hubs...</div>';
            
            try {
                // Check Bluetooth support
                if (!navigator.bluetooth) {
                    list.innerHTML = `
                        <div style="text-align:center;padding:20px;color:#f87171;">
                            ❌ Web Bluetooth is not supported.<br>
                            <div style="font-size:13px;color:#6b7280;margin-top:8px;">
                                Please use Chrome or Edge browser.
                            </div>
                        </div>
                    `;
                    return;
                }

                // Request BLE device - this prompts the user to select a device
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [BLE_SERVICE_UUID] }],
                    optionalServices: [BLE_SERVICE_UUID]
                });

                if (!device) {
                    list.innerHTML = '<div style="text-align:center;padding:20px;color:#6b7280;">No devices found.</div>';
                    return;
                }

                // Connect
                list.innerHTML = '<div class="loading"><div class="spinner"></div>Connecting to hub...</div>';
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(BLE_SERVICE_UUID);
                const characteristic = await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);

                // Read device info
                const value = await characteristic.read();
                const decoder = new TextDecoder('utf-8');
                const info = JSON.parse(decoder.decode(value));

                // Store for later
                currentBleDevice = device;
                currentBleCharacteristic = characteristic;
                currentConfigHubId = info.device_id;

                // Show discovered hub
                list.innerHTML = `
                    <div class="hub-item" style="border:2px solid rgba(74,222,128,0.5);background:rgba(74,222,128,0.05);">
                        <div>
                            <span class="hub-name">${info.device_name || info.device_id}</span>
                            <span class="badge pairing">PAIRING</span>
                            <span class="hub-id">${info.device_id}</span>
                            <span class="hub-ip">· ${info.mac || 'BLE'}</span>
                        </div>
                        <div class="hub-actions">
                            <button class="btn btn-success" onclick="claimBleHub()">
                                ➕ Claim & Configure
                            </button>
                        </div>
                    </div>
                    <div style="font-size:12px;color:#6b7280;margin-top:8px;">
                        💡 Connected via Bluetooth. Enter WiFi credentials to set up the hub.
                    </div>
                `;

            } catch (error) {
                console.error('BLE scan error:', error);
                list.innerHTML = `
                    <div style="text-align:center;padding:20px;color:#f87171;">
                        ❌ ${error.message || 'Scan failed'}<br>
                        <div style="font-size:13px;color:#6b7280;margin-top:8px;">
                            Make sure Bluetooth is enabled and the ESP32 is powered on.
                        </div>
                        <div style="margin-top:12px;">
                            <button class="btn btn-secondary" onclick="scanForHubs()">🔄 Try Again</button>
                        </div>
                    </div>
                `;
            }
        }

        // ==========================================
        // CLAIM BLE HUB
        // ==========================================
        async function claimBleHub() {
            if (!currentBleCharacteristic) {
                showToast('❌ No BLE device found. Please scan first.', 'error');
                return;
            }

            showToast('📥 Claiming hub...', 'warning');
            
            // Open config modal
            document.getElementById('configHubId').textContent = currentConfigHubId;
            document.getElementById('configHubStatus').textContent = '📡 Connected via Bluetooth';
            document.getElementById('configSSID').value = '';
            document.getElementById('configPassword').value = '';
            document.getElementById('configDeviceName').value = currentConfigHubId || 'farmiot-hub';
            document.getElementById('configMQTT').value = 'broker.hivemq.com';
            document.getElementById('configMQTTPort').value = '1883';
            
            openModal('configModal');
        }

        // ==========================================
        // SAVE CONFIG VIA BLE
        // ==========================================
        async function saveConfig() {
            const ssid = document.getElementById('configSSID').value.trim();
            const password = document.getElementById('configPassword').value.trim();
            const mqtt = document.getElementById('configMQTT').value.trim() || 'broker.hivemq.com';
            const port = parseInt(document.getElementById('configMQTTPort').value) || 1883;

            if (!ssid) {
                showToast('❌ WiFi SSID is required', 'error');
                return;
            }

            const btn = document.getElementById('configSaveBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Sending...';
            document.getElementById('configHubStatus').textContent = '📤 Sending WiFi config via BLE...';

            try {
                // Build config JSON
                const config = {
                    ssid: ssid,
                    password: password,
                    mqtt: mqtt,
                    port: port
                };
                const configStr = JSON.stringify(config);
                
                // Send via BLE
                const encoder = new TextEncoder();
                const data = encoder.encode(configStr);
                await currentBleCharacteristic.writeValue(data);

                // Listen for confirmation
                document.getElementById('configHubStatus').textContent = '⏳ Waiting for confirmation...';
                
                await currentBleCharacteristic.startNotifications();
                currentBleCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value;
                    const decoder = new TextDecoder('utf-8');
                    const response = decoder.decode(value);
                    
                    try {
                        const result = JSON.parse(response);
                        if (result.status === 'success') {
                            showToast('✅ WiFi configured! Hub is connecting.', 'success');
                            document.getElementById('configHubStatus').textContent = '✅ Config sent! Hub connecting to WiFi...';
                            
                            // Claim in cloud
                            claimHubInCloud(currentConfigHubId);
                            
                            setTimeout(() => {
                                closeModal('configModal');
                                loadHubs();
                            }, 2000);
                        } else {
                            showToast('❌ ' + (result.message || 'Configuration failed'), 'error');
                        }
                    } catch (e) {
                        console.log('BLE response:', response);
                    }
                });

                setTimeout(() => {
                    currentBleCharacteristic.stopNotifications();
                    btn.disabled = false;
                    btn.innerHTML = '💾 Save';
                }, 5000);

            } catch (error) {
                console.error('BLE send error:', error);
                showToast('❌ Failed to send config: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '💾 Save';
            }
        }

        // ==========================================
        // CLAIM HUB IN CLOUD
        // ==========================================
        async function claimHubInCloud(hubId) {
            try {
                const result = await apiRequest('/api/hubs/add', {
                    method: 'POST',
                    body: JSON.stringify({ 
                        hub_id: hubId, 
                        ip_address: null,
                        name: hubId
                    })
                });
                
                if (result.success) {
                    console.log('✅ Hub claimed in cloud');
                }
            } catch (error) {
                console.error('Cloud claim error:', error);
            }
        }

        // ==========================================
        // API REQUEST
        // ==========================================
        async function apiRequest(endpoint, options = {}) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            const response = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers
            });
            return response.json();
        }

        // ==========================================
        // LOAD HUBS FROM CLOUD
        // ==========================================
        async function loadHubs() {
            const container = document.getElementById('hubList');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading hubs...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/hubs`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to load hubs');
                
                const hubs = await response.json();
                
                if (!Array.isArray(hubs) || hubs.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:20px;color:#6b7280;">
                            No hubs configured yet.<br>
                            Click "Scan" to discover a hub via Bluetooth.
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = hubs.map(hub => `
                    <div class="hub-item">
                        <div>
                            <span class="hub-name">${hub.device_name || hub.hub_id}</span>
                            <span class="badge ${hub.status === 'online' ? 'online' : 'pairing'}">
                                ${hub.status || 'offline'}
                            </span>
                            <span class="hub-id">${hub.hub_id}</span>
                            ${hub.ip_address ? `<span class="hub-ip">· ${hub.ip_address}</span>` : ''}
                        </div>
                        <div class="hub-actions">
                            <button class="btn btn-secondary" onclick="rebootHub('${hub.hub_id}')">🔄</button>
                            <button class="btn btn-danger" onclick="deleteHub('${hub.hub_id}')">🗑️</button>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading hubs:', error);
                container.innerHTML = `
                    <div style="text-align:center;padding:20px;color:#f87171;">
                        ❌ ${error.message || 'Failed to load hubs'}
                    </div>
                `;
            }
        }

        // ==========================================
        // REBOOT HUB
        // ==========================================
        async function rebootHub(hubId) {
            if (!confirm(`Reboot ${hubId}?`)) return;
            
            showToast('🔄 Rebooting...', 'warning');
            try {
                const result = await apiRequest(`/api/hubs/${hubId}/reboot`, { method: 'POST' });
                if (result.success) {
                    showToast('✅ Reboot command sent', 'success');
                    setTimeout(loadHubs, 3000);
                } else {
                    showToast('❌ ' + (result.error || 'Failed to reboot'), 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ==========================================
        // DELETE HUB
        // ==========================================
        async function deleteHub(hubId) {
            if (!confirm(`Delete ${hubId}?`)) return;
            
            showToast('🗑️ Deleting...', 'warning');
            try {
                const result = await apiRequest(`/api/hubs/${hubId}`, { method: 'DELETE' });
                if (result.success) {
                    showToast('✅ Hub deleted', 'success');
                    loadHubs();
                } else {
                    showToast('❌ ' + (result.error || 'Failed to delete'), 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            // ... existing auth code ...
            
            // Auto-scan after login
            setTimeout(() => {
                if (token) {
                    scanForHubs();
                }
            }, 3000);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmIOT - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            color: #e5e7eb;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(17, 24, 39, 0.9);
            padding: 20px;
            border-radius: 16px;
            margin: 12px 0;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
        }
        .card:hover { border-color: rgba(74,222,128,0.15); }
        .card p {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .online { color: #4ade80; }
        .offline { color: #f87171; }
        .discovering { color: #fbbf24; }
        .status-indicator {
            font-size: 24px;
            font-weight: 700;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            color: #0a0e17;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: #9ca3af;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); }
        .btn-success {
            background: rgba(74,222,128,0.1);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.15);
        }
        .btn-success:hover { background: rgba(74,222,128,0.2); }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .btn-group .btn { flex: 1; min-width: 80px; text-align: center; }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        .status-dot.online { background: #4ade80; }
        .status-dot.offline { background: #f87171; }
        .status-dot.discovering { background: #fbbf24; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(17,24,39,0.95);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e5e7eb;
            font-size: 14px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 3px solid #4ade80; }
        .toast.error { border-left: 3px solid #f87171; }
        .toast.info { border-left: 3px solid #60a5fa; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .server-info {
            text-align: center;
            font-size: 12px;
            color: #4b5563;
            margin-top: 16px;
        }
        .server-info a { color: #4ade80; text-decoration: none; }
        .discovery-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
        }
        .status-text {
            font-size: 14px;
            margin-top: 4px;
        }
        @media (max-width: 480px) {
            .container { padding: 0 4px; }
            .card { padding: 16px; }
            .btn-group .btn { min-width: 60px; font-size: 12px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚜 FarmIOT</h1>
    <div class="subtitle" id="liveTime">Scanning for devices...</div>

    <!-- Hub Card -->
    <div class="card">
        <span class="icon">📡</span>
        <p>Hub</p>
        <div id="hubStatus" class="status-indicator offline">
            <span class="status-dot offline"></span> SCANNING
        </div>
        <div id="hubInfo" class="status-text">Looking for hubs on your network...</div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="scanForHubs()">🔍 Scan</button>
        </div>
    </div>

    <!-- Discovered Hubs -->
    <div id="discoveredHubs"></div>

    <!-- Sensor Card -->
    <div class="card">
        <span class="icon">🌱</span>
        <p>Sensor</p>
        <div id="sensorStatus" class="status-indicator offline">
            <span class="status-dot offline"></span> OFFLINE
        </div>
        <div id="sensorInfo" class="status-text">No sensor connected</div>
    </div>

    <!-- Soil Card -->
    <div class="card">
        <span class="icon">💧</span>
        <p>Soil Moisture</p>
        <div id="soilDisplay" class="soil-value" style="font-size:40px;font-weight:700;color:#fbbf24;">—</div>
        <div class="soil-label">ADC</div>
        <div id="soilLastUpdated" class="status-text">Waiting for data...</div>
    </div>

    <div class="server-info">
        🔗 <a href="https://farm-iot.onrender.com" target="_blank">farm-iot.onrender.com</a>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    const API_BASE = window.location.origin;
    const DEVICE_ID = 'FarmIOT_Hub_001';
    let discoveredDevices = [];
    let startTime = Date.now();

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + type + ' show';
        clearTimeout(toast._hide);
        toast._hide = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ==========================================
    // SCAN FOR HUBS (No AP connection needed!)
    // ==========================================
    async function scanForHubs() {
        showToast('🔍 Scanning for hubs...', 'info');
        
        try {
            // Try mDNS discovery first (if browser supports it)
            // Fallback: call server API
            const response = await fetch(`${API_BASE}/api/discover`, {
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token') || ''}`
                }
            });
            
            if (response.ok) {
                const hubs = await response.json();
                discoveredDevices = hubs;
                renderDiscoveredHubs(hubs);
                
                if (hubs.length === 0) {
                    showToast('🔍 No hubs found. Make sure ESP32 is powered on.', 'info');
                } else {
                    showToast(`✅ Found ${hubs.length} hub(s)!`, 'success');
                }
            } else {
                // If auth fails, try without auth (discovery mode)
                const publicResponse = await fetch(`${API_BASE}/api/discover/public`);
                if (publicResponse.ok) {
                    const hubs = await publicResponse.json();
                    discoveredDevices = hubs;
                    renderDiscoveredHubs(hubs);
                }
            }
        } catch (error) {
            console.error('Scan error:', error);
            showToast('❌ Scan failed. Check if ESP32 is powered on.', 'error');
        }
    }

    function renderDiscoveredHubs(hubs) {
        const container = document.getElementById('discoveredHubs');
        
        if (hubs.length === 0) {
            container.innerHTML = `
                <div class="card" style="border-color: rgba(251,191,36,0.2);">
                    <p>🔍 No hubs discovered</p>
                    <div style="color:#6b7280;font-size:14px;">
                        Make sure your ESP32 is powered on and on the same network.
                        <br>It will auto-discover via mDNS at <strong>farmiot-hub.local</strong>
                    </div>
                </div>
            `;
            return;
        }

        container.innerHTML = hubs.map(hub => `
            <div class="card" style="border-color: rgba(74,222,128,0.2);">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <span style="font-weight:600;">📡 ${hub.name || hub.hub_id}</span>
                        <span class="discovery-badge" style="margin-left:8px;">${hub.status || 'discovering'}</span>
                    </div>
                    <span style="color:#6b7280;font-size:12px;">${hub.ip_address || 'IP unknown'}</span>
                </div>
                <div style="font-size:13px;color:#6b7280;margin-top:4px;">
                    ID: ${hub.hub_id} · ${hub.mac_address || 'MAC unknown'}
                </div>
                <div class="btn-group">
                    <button class="btn btn-success" onclick="connectHub('${hub.hub_id}')">🔗 Connect to Account</button>
                    <button class="btn btn-secondary" onclick="configureHub('${hub.hub_id}')">⚙️ Configure</button>
                </div>
            </div>
        `).join('');
    }

    // ==========================================
    // CONNECT HUB TO USER ACCOUNT
    // ==========================================
    async function connectHub(hubId) {
        showToast('🔗 Connecting hub...', 'info');
        
        try {
            const response = await fetch(`${API_BASE}/api/hubs/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token') || ''}`
                },
                body: JSON.stringify({
                    hub_id: hubId,
                    status: 'online'
                })
            });
            
            if (response.ok) {
                showToast('✅ Hub connected to your account!', 'success');
                setTimeout(scanForHubs, 2000);
            } else {
                const error = await response.json();
                showToast('❌ ' + (error.error || 'Failed to connect'), 'error');
            }
        } catch (error) {
            showToast('❌ Error: ' + error.message, 'error');
        }
    }

    // ==========================================
    // CONFIGURE HUB (WiFi Setup)
    // ==========================================
    function configureHub(hubId) {
        // Open a modal or prompt for WiFi credentials
        const ssid = prompt('Enter WiFi SSID:');
        if (!ssid) return;
        
        const password = prompt('Enter WiFi Password:');
        
        saveConfig(hubId, ssid, password);
    }

    async function saveConfig(hubId, ssid, password) {
        showToast('💾 Saving configuration...', 'info');
        
        try {
            const response = await fetch(`${API_BASE}/api/hubs/${hubId}/config`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token') || ''}`
                },
                body: JSON.stringify({
                    ssid: ssid,
                    password: password || '',
                    mqtt_server: 'broker.hivemq.com',
                    mqtt_port: 1883
                })
            });
            
            if (response.ok) {
                showToast('✅ Config saved! ESP32 will reboot.', 'success');
                setTimeout(scanForHubs, 5000);
            } else {
                const error = await response.json();
                showToast('❌ ' + (error.error || 'Failed to save'), 'error');
            }
        } catch (error) {
            showToast('❌ Error: ' + error.message, 'error');
        }
    }

    // ==========================================
    // AUTO-SCAN EVERY 30 SECONDS
    // ==========================================
    function updateTime() {
        const now = new Date();
        const time = now.toLocaleTimeString('en-US', { hour12: false });
        document.getElementById('liveTime').textContent = time + ' | Scanning for devices...';
    }

    // Initial scan
    scanForHubs();
    setInterval(scanForHubs, 30000);
    setInterval(updateTime, 1000);
    updateTime();
</script>
</body>
</html>

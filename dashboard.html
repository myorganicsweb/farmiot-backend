<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmIOT Dashboard</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin: 10px auto; max-width: 400px; border: 1px solid #333; }
    .online { color: #4CAF50; }
    .offline { color: #f44336; }
  </style>
</head>
<body>

  <h1>🚜 FarmIOT</h1>

  <div class="card">
    <p>📡 Hub ESP32 Status</p>
    <h2 id="hubStatus" class="offline">● OFFLINE</h2>
  </div>

  <div class="card">
    <p>🌱 Sensor ESP32 Status</p>
    <h2 id="sensorStatus" class="offline">● OFFLINE</h2>
  </div>

  <div class="card">
    <p>Latest Soil Reading</p>
    <h2 id="soilDisplay">--%</h2>
  </div>

  <script>
    let hubLastSeen = 0;
    let sensorLastSeen = 0;
    let latestSoil = 0;

    async function checkStatus() {
      try {
        const res = await fetch('/api/esp32/status');
        const data = await res.json();
        
        // Hub is online if server is reachable
        document.getElementById('hubStatus').innerText = '● ONLINE';
        document.getElementById('hubStatus').className = 'online';
      } catch (e) {
        document.getElementById('hubStatus').innerText = '● OFFLINE';
        document.getElementById('hubStatus').className = 'offline';
      }
    }

    async function checkSoil() {
      try {
        const res = await fetch('/api/esp32/soil');
        const data = await res.json();
        const raw = data.moisture || 0;
        
        // If raw > 0, the sensor is alive
        if (raw > 0) {
          document.getElementById('sensorStatus').innerText = '● ONLINE';
          document.getElementById('sensorStatus').className = 'online';
        } else {
          document.getElementById('sensorStatus').innerText = '● OFFLINE';
          document.getElementById('sensorStatus').className = 'offline';
        }

        // Convert to percentage
        const percent = Math.min(100, Math.max(0, (1 - (raw / 4095)) * 100));
        document.getElementById('soilDisplay').innerText = Math.round(percent) + '%';
      } catch (e) {
        document.getElementById('soilDisplay').innerText = '--%';
      }
    }

    setInterval(checkStatus, 5000);
    setInterval(checkSoil, 5000);
    checkStatus();
    checkSoil();
  </script>

</body>
</html>

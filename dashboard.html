<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmIOT Hub Status</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin: 10px auto; max-width: 400px; }
    .online { color: #4CAF50; }
    .offline { color: #f44336; }
  </style>
</head>
<body>
  <h1>🚜 FarmIOT Hub</h1>
  <div class="card">
    <p>Hub Status</p>
    <h2 id="statusBadge" class="offline">● OFFLINE</h2>
  </div>
  <script>
    async function checkStatus() {
      try {
        const res = await fetch('/api/hub/status');
        const data = await res.json();
        const badge = document.getElementById('statusBadge');
        badge.innerText = data.online ? '● ONLINE' : '● OFFLINE';
        badge.className = data.online ? 'online' : 'offline';
      } catch (e) {
        console.log("Status fetch failed");
      }
    }
    setInterval(checkStatus, 5000);
    checkStatus();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmIOT</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        /* ... existing styles ... */
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-indicator.online {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
        }
        .status-indicator.offline {
            background: rgba(248,113,113,0.15);
            color: #f87171;
        }
        .status-indicator.pairing {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.online { background: #4ade80; }
        .status-dot.offline { background: #f87171; }
        .status-dot.pairing { background: #fbbf24; }
        
        .hub-item .status-badge {
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <!-- ... existing HTML ... -->
    
    <script>
    // ... existing code ...
    
    // ==========================================
    // UPDATE HUB STATUS IN UI
    // ==========================================
    function updateHubStatus(hubId, status, ip) {
        const items = document.querySelectorAll('.hub-item');
        items.forEach(item => {
            const idEl = item.querySelector('.hub-id');
            if (idEl && idEl.textContent === hubId) {
                const badge = item.querySelector('.status-badge');
                if (badge) {
                    badge.className = 'status-indicator ' + status;
                    badge.innerHTML = `
                        <span class="status-dot ${status}"></span>
                        ${status === 'online' ? 'Online' : status === 'offline' ? 'Offline' : 'Pairing'}
                        ${ip ? '· ' + ip : ''}
                    `;
                }
            }
        });
    }
    
    // ==========================================
    // LOAD HUBS WITH STATUS
    // ==========================================
    async function loadHubs() {
        const container = document.getElementById('hubList');
        container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading hubs...</div>';
        
        try {
            const response = await fetch(`${API_BASE}/api/hubs`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (!response.ok) throw new Error('Failed to load hubs');
            
            const hubs = await response.json();
            
            if (!Array.isArray(hubs) || hubs.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:20px;color:#6b7280;">
                        No hubs configured yet.<br>
                        Click "Scan" to discover a hub via Bluetooth.
                    </div>
                `;
                return;
            }
            
            container.innerHTML = hubs.map(hub => {
                const status = hub.status || 'offline';
                const statusClass = status === 'online' ? 'online' : status === 'pairing' ? 'pairing' : 'offline';
                
                return `
                <div class="hub-item">
                    <div>
                        <span class="hub-name">${hub.device_name || hub.hub_id}</span>
                        <span class="status-indicator ${statusClass}">
                            <span class="status-dot ${statusClass}"></span>
                            ${status === 'online' ? 'Online' : status === 'pairing' ? 'Pairing' : 'Offline'}
                            ${hub.ip_address ? '· ' + hub.ip_address : ''}
                        </span>
                        <span class="hub-id">${hub.hub_id}</span>
                    </div>
                    <div class="hub-actions">
                        ${status === 'pairing' ? 
                            `<button class="btn btn-success" onclick="openConfig('${hub.hub_id}')">⚙️ Configure</button>` :
                            `<button class="btn btn-secondary" onclick="rebootHub('${hub.hub_id}')">🔄 Reboot</button>`
                        }
                        <button class="btn btn-danger" onclick="deleteHub('${hub.hub_id}')">🗑️</button>
                    </div>
                </div>
            `}).join('');
            
        } catch (error) {
            console.error('Error loading hubs:', error);
            container.innerHTML = `
                <div style="text-align:center;padding:20px;color:#f87171;">
                    ❌ ${error.message || 'Failed to load hubs'}
                    <br><br>
                    <button class="btn btn-secondary" onclick="loadHubs()">🔄 Retry</button>
                </div>
            `;
        }
    }
    
    // ==========================================
    // CONNECT TO BLE DEVICE
    // ==========================================
    async function connectBleDevice(device) {
        try {
            const server = await device.gatt.connect();
            bleServer = server;
            currentBleDevice = device;
            
            const service = await server.getPrimaryService(BLE_SERVICE_UUID);
            const characteristic = await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);
            currentBleCharacteristic = characteristic;
            
            const value = await characteristic.readValue();
            const decoder = new TextDecoder('utf-8');
            const info = JSON.parse(decoder.decode(value));
            
            currentConfigHubId = info.device_id;
            isConnected = true;
            
            localStorage.setItem('ble_device_id', device.id || device.name);
            
            updateBleStatus('connected', '🟢 ' + (device.name || 'Connected'));
            console.log('✅ BLE Connected:', info);
            
            showDiscoveredHub(info, device);
            
            // Check if hub is already configured (online)
            if (info.status === 'online') {
                showToast('✅ Hub is already online!', 'success');
                document.getElementById('discoveryCard').style.display = 'none';
                loadHubs();
                // Disconnect BLE since WiFi is connected
                setTimeout(() => {
                    if (currentBleDevice && currentBleDevice.gatt) {
                        currentBleDevice.gatt.disconnect();
                    }
                }, 2000);
            } else {
                // Hub is in pairing mode - open config
                setTimeout(() => {
                    claimBleHub();
                }, 500);
            }
            
            return true;
        } catch (error) {
            console.error('BLE connection error:', error);
            isConnected = false;
            updateBleStatus('disconnected');
            return false;
        }
    }
    
    // ==========================================
    // SAVE CONFIG VIA BLE
    // ==========================================
    async function saveConfig() {
        const ssid = document.getElementById('configSSID').value.trim();
        const password = document.getElementById('configPassword').value.trim();
        const name = document.getElementById('configDeviceName').value.trim() || currentConfigHubId;
        const mqtt = document.getElementById('configMQTT').value.trim() || 'broker.hivemq.com';
        const port = parseInt(document.getElementById('configMQTTPort').value) || 1883;

        if (!ssid) {
            showToast('❌ WiFi SSID is required', 'error');
            return;
        }

        const btn = document.getElementById('configSaveBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Configuring...';
        document.getElementById('configHubStatus').textContent = '📤 Sending WiFi config...';

        try {
            const config = {
                ssid: ssid,
                password: password,
                mqtt: mqtt,
                port: port,
                device_name: name
            };
            
            const encoder = new TextEncoder();
            await currentBleCharacteristic.writeValue(encoder.encode(JSON.stringify(config)));

            document.getElementById('configHubStatus').textContent = '⏳ ESP32 connecting to WiFi...';
            showToast('📤 Config sent. ESP32 is connecting...', 'warning');
            
            // Listen for status updates
            await currentBleCharacteristic.startNotifications();
            let statusReceived = false;
            
            const handler = (event) => {
                const value = event.target.value;
                const decoder = new TextDecoder('utf-8');
                const response = decoder.decode(value);
                
                try {
                    const result = JSON.parse(response);
                    if (result.status === 'online') {
                        statusReceived = true;
                        showToast('✅ WiFi Connected! Hub is online.', 'success');
                        document.getElementById('configHubStatus').textContent = '✅ Online!';
                        
                        claimHubInCloud(currentConfigHubId);
                        
                        setTimeout(() => {
                            closeModal('configModal');
                            loadHubs();
                            // BLE will be stopped by ESP32
                            if (currentBleDevice && currentBleDevice.gatt) {
                                currentBleDevice.gatt.disconnect();
                            }
                        }, 2000);
                    } else if (result.status === 'failed') {
                        statusReceived = true;
                        showToast('❌ WiFi failed: ' + (result.message || 'Check credentials'), 'error');
                        document.getElementById('configHubStatus').textContent = '❌ Connection failed';
                        btn.disabled = false;
                        btn.innerHTML = '💾 Retry';
                    }
                    currentBleCharacteristic.removeEventListener('characteristicvaluechanged', handler);
                    currentBleCharacteristic.stopNotifications();
                } catch (e) {
                    // Not a valid response yet
                }
            };
            
            currentBleCharacteristic.addEventListener('characteristicvaluechanged', handler);
            
            setTimeout(() => {
                if (!statusReceived) {
                    showToast('⏳ No status received. Check ESP32 serial monitor.', 'warning');
                    document.getElementById('configHubStatus').textContent = '⏳ Timeout - check ESP32';
                    btn.disabled = false;
                    btn.innerHTML = '💾 Configure';
                    try {
                        currentBleCharacteristic.removeEventListener('characteristicvaluechanged', handler);
                        currentBleCharacteristic.stopNotifications();
                    } catch (e) {}
                }
            }, 30000);

        } catch (error) {
            console.error('BLE send error:', error);
            showToast('❌ Failed to send config: ' + error.message, 'error');
            btn.disabled = false;
            btn.innerHTML = '💾 Configure';
        }
    }
    
    </script>
</body>
</html>

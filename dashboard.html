<!DOCTYPE html>
<html>
<head>
  <title>FarmIOT Dashboard</title>
</head>
<body>
  <h1>FarmIOT Dashboard</h1>
  <p>Soil Moisture: <span id="soilText">--</span>%</p>
  <p>ESP32 Status: <span id="espStatus">● Offline</span></p>

  <script>
    async function fetchSoil() {
      try {
        const res = await fetch('/api/esp32/soil');
        const data = await res.json();
        const moisture = data.moisture || 0;
        const percentage = Math.min(100, Math.max(0, (1 - (moisture / 4095)) * 100));
        document.getElementById('soilText').innerText = percentage.toFixed(0);
      } catch (err) {
        console.log("Soil fetch failed");
      }
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/esp32/status');
        const data = await res.json();
        document.getElementById('espStatus').innerText = data.online ? '● Online' : '● Offline';
        document.getElementById('espStatus').style.color = data.online ? 'green' : 'red';
      } catch (err) {
        document.getElementById('espStatus').innerText = '● Offline';
        document.getElementById('espStatus').style.color = 'red';
      }
    }

    setInterval(fetchSoil, 5000);
    setInterval(fetchStatus, 5000);
    fetchSoil();
    fetchStatus();
  </script>
</body>
</html>

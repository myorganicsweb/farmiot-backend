<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmIOT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            color: #e5e7eb;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { max-width: 500px; width: 100%; }
        h1 {
            font-size: 28px;
            text-align: center;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(17, 24, 39, 0.9);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
        }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #e5e7eb; }
        .form-group { margin-bottom: 14px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #e5e7eb;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: #4ade80; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            color: #0a0e17;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(74,222,128,0.2); }
        .btn-danger {
            background: rgba(248,113,113,0.1);
            color: #f87171;
            border: 1px solid rgba(248,113,113,0.15);
        }
        .btn-danger:hover { background: rgba(248,113,113,0.2); }
        .toggle {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .toggle button {
            flex: 1;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: #6b7280;
            font-family: inherit;
        }
        .toggle button.active {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(17,24,39,0.95);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e5e7eb;
            font-size: 14px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s;
            z-index: 2000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 3px solid #4ade80; }
        .toast.error { border-left: 3px solid #f87171; }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }
        .status.success { display: block; background: rgba(74,222,128,0.08); color: #4ade80; border: 1px solid rgba(74,222,128,0.15); }
        .status.error { display: block; background: rgba(248,113,113,0.08); color: #f87171; border: 1px solid rgba(248,113,113,0.15); }
        .confirm { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚜 FarmIOT</h1>

    <div class="card">
        <div class="toggle">
            <button class="active" id="loginTab" onclick="setMode('login')">Sign In</button>
            <button id="registerTab" onclick="setMode('register')">Register</button>
        </div>

        <form id="authForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" minlength="6" required>
            </div>
            <div class="form-group confirm" id="confirmGroup">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <div id="userInfo" style="display:none; text-align:center; padding:20px; color:#6b7280;">
        👋 Logged in as <strong id="userEmail" style="color:#e5e7eb;"></strong>
        <br><br>
        <button class="btn btn-danger" onclick="logout()">Sign Out</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let mode = 'login';
    const API_BASE = window.location.origin;

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + type + ' show';
        clearTimeout(toast._hide);
        toast._hide = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function setMode(m) {
        mode = m;
        document.getElementById('loginTab').classList.toggle('active', m === 'login');
        document.getElementById('registerTab').classList.toggle('active', m === 'register');
        document.getElementById('confirmGroup').style.display = m === 'register' ? 'block' : 'none';
        document.getElementById('submitBtn').textContent = m === 'login' ? 'Sign In' : 'Register';
        document.getElementById('status').className = 'status';
        document.getElementById('status').textContent = '';
    }

    async function handleSubmit(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById('submitBtn');

        if (!email || !password) {
            showToast('❌ Please fill in all fields', 'error');
            return;
        }

        if (mode === 'register' && password !== confirmPassword) {
            showToast('❌ Passwords do not match', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Processing...';
        status.className = 'status';
        status.textContent = '';

        try {
            const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
            const response = await fetch(`${API_BASE}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showToast(mode === 'login' ? '✅ Welcome back!' : '✅ Account created!', 'success');
                document.getElementById('userInfo').style.display = 'block';
                document.getElementById('userEmail').textContent = data.user.email;
                document.querySelector('.card').style.display = 'none';
                status.className = 'status success';
                status.textContent = '✅ ' + (mode === 'login' ? 'Logged in successfully!' : 'Registered successfully!');
            } else {
                status.className = 'status error';
                status.textContent = '❌ ' + (data.error || 'Something went wrong');
                showToast('❌ ' + data.error, 'error');
            }
        } catch (error) {
            status.className = 'status error';
            status.textContent = '❌ Network error: ' + error.message;
            showToast('❌ Network error', 'error');
        }

        btn.disabled = false;
        btn.innerHTML = mode === 'login' ? 'Sign In' : 'Register';
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        document.getElementById('userInfo').style.display = 'none';
        document.querySelector('.card').style.display = 'block';
        showToast('✅ Logged out', 'success');
    }

    // Check if already logged in
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (token && user) {
        document.getElementById('userInfo').style.display = 'block';
        document.getElementById('userEmail').textContent = user.email;
        document.querySelector('.card').style.display = 'none';
    }

    setMode('login');
</script>
</body>
</html>

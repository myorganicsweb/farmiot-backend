<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmIOT</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            color: #e5e7eb;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 {
            font-size: 32px;
            text-align: center;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { text-align: center; color: #6b7280; margin-bottom: 30px; }
        .card {
            background: rgba(17, 24, 39, 0.9);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .card-header h2 { font-size: 18px; font-weight: 600; }
        .form-group { margin-bottom: 14px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #e5e7eb;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: #4ade80; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            color: #0a0e17;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(74,222,128,0.2); }
        .btn-danger {
            background: rgba(248,113,113,0.1);
            color: #f87171;
            border: 1px solid rgba(248,113,113,0.15);
        }
        .btn-danger:hover { background: rgba(248,113,113,0.2); }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: #9ca3af;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); }
        .toggle {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .toggle button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: #6b7280;
            font-family: inherit;
        }
        .toggle button.active {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.online {
            background: rgba(74,222,128,0.1);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.15);
        }
        .badge.offline {
            background: rgba(248,113,113,0.1);
            color: #f87171;
            border: 1px solid rgba(248,113,113,0.15);
        }
        .soil-value {
            font-size: 36px;
            font-weight: 700;
            color: #fbbf24;
        }
        .soil-time { color: #6b7280; font-size: 14px; margin-top: 4px; }
        .hub-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .hub-name { font-weight: 600; }
        .hub-id { font-size: 12px; color: #6b7280; }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(17,24,39,0.95);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e5e7eb;
            font-size: 14px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s;
            z-index: 2000;
            max-width: 90%;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 3px solid #4ade80; }
        .toast.error { border-left: 3px solid #f87171; }
        .hidden { display: none !important; }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }
        .status.success { display: block; background: rgba(74,222,128,0.08); color: #4ade80; border: 1px solid rgba(74,222,128,0.15); }
        .status.error { display: block; background: rgba(248,113,113,0.08); color: #f87171; border: 1px solid rgba(248,113,113,0.15); }
        .user-info { text-align: center; padding: 10px; color: #6b7280; }
        .user-info strong { color: #e5e7eb; }
        .loading { text-align: center; padding: 20px; color: #6b7280; }
        #googleBtn { display: flex; justify-content: center; margin: 10px 0; }
        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
            color: #374151;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .divider span { padding: 0 12px; }
        @media (max-width: 600px) {
            .hub-item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚜 FarmIOT</h1>
    <p class="subtitle">Smart Agriculture Platform</p>

    <!-- Auth Card -->
    <div class="card" id="authCard">
        <!-- Google Button -->
        <div id="googleBtn"></div>
        
        <div class="divider"><span>or</span></div>
        
        <div class="toggle">
            <button class="active" id="loginTab" onclick="setMode('login')">Sign In</button>
            <button id="registerTab" onclick="setMode('register')">Register</button>
        </div>
        <form id="authForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" minlength="6" required>
            </div>
            <div class="form-group" id="confirmGroup" style="display:none;">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>
        </form>
        <div id="status" class="status"></div>
    </div>

    <!-- User Info -->
    <div id="userInfo" style="display:none;" class="card">
        <div class="user-info">
            👋 Logged in as <strong id="userName"></strong><br>
            <span style="font-size:12px;color:#6b7280;" id="userEmail"></span>
        </div>
        <button class="btn btn-danger" onclick="logout()" style="margin-top:10px;">Sign Out</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboardContent" class="hidden">
        <div class="card">
            <div class="card-header">
                <h2>💧 Soil Moisture</h2>
                <span class="badge" id="soilStatus">Loading...</span>
            </div>
            <div class="soil-value" id="soilValue">—</div>
            <div class="soil-time" id="soilTime">Waiting for data...</div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>📡 Hubs</h2>
                <button class="btn btn-secondary" onclick="loadHubs()" style="width:auto;padding:6px 16px;">🔄 Refresh</button>
            </div>
            <div id="hubList">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading hubs...
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const API_BASE = window.location.origin;
    let token = localStorage.getItem('token') || null;
    let user = JSON.parse(localStorage.getItem('user') || 'null');
    let mode = 'login';

    // ==========================================
    // TOAST
    // ==========================================
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + type + ' show';
        clearTimeout(toast._hide);
        toast._hide = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ==========================================
    // API
    // ==========================================
    async function apiRequest(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
        const response = await fetch(`${API_BASE}${endpoint}`, {
            ...options,
            headers
        });
        return response.json();
    }

    // ==========================================
    // GOOGLE SSO
    // ==========================================
    function initGoogleSSO() {
        try {
            google.accounts.id.initialize({
                client_id: '472048491207-hofjvaisdj9vnaglutb9kd23ci948jc5.apps.googleusercontent.com',
                callback: async (response) => {
                    console.log('📥 Google callback received');
                    try {
                        const result = await apiRequest('/api/auth/google', {
                            method: 'POST',
                            body: JSON.stringify({ id_token: response.credential })
                        });
                        
                        if (result.success) {
                            token = result.token;
                            user = result.user;
                            localStorage.setItem('token', token);
                            localStorage.setItem('user', JSON.stringify(user));
                            showUser(user);
                            showToast('✅ Welcome, ' + user.name + '!');
                            loadDashboard();
                        } else {
                            showToast('❌ ' + result.error, 'error');
                        }
                    } catch (error) {
                        console.error('Google login error:', error);
                        showToast('❌ Login failed: ' + error.message, 'error');
                    }
                },
                cancel_on_tap_outside: false,
            });
            
            google.accounts.id.renderButton(
                document.getElementById('googleBtn'),
                {
                    theme: 'outline',
                    size: 'large',
                    text: 'signin_with',
                    shape: 'pill',
                    logo_alignment: 'left'
                }
            );
        } catch (error) {
            console.error('Google init error:', error);
        }
    }

    // ==========================================
    // AUTH
    // ==========================================
    function setMode(m) {
        mode = m;
        document.getElementById('loginTab').classList.toggle('active', m === 'login');
        document.getElementById('registerTab').classList.toggle('active', m === 'register');
        document.getElementById('confirmGroup').style.display = m === 'register' ? 'block' : 'none';
        document.getElementById('submitBtn').textContent = m === 'login' ? 'Sign In' : 'Register';
    }

    async function handleSubmit(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById('submitBtn');

        if (!email || !password) {
            showToast('❌ Please fill in all fields', 'error');
            return;
        }

        if (mode === 'register' && password !== confirmPassword) {
            showToast('❌ Passwords do not match', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Processing...';
        status.className = 'status';
        status.textContent = '';

        try {
            const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
            const data = await apiRequest(endpoint, {
                method: 'POST',
                body: JSON.stringify({ email, password })
            });

            if (data.success) {
                token = data.token;
                user = data.user;
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(user));
                showUser(user);
                showToast(mode === 'login' ? '✅ Welcome back!' : '✅ Account created!', 'success');
                loadDashboard();
            } else {
                status.className = 'status error';
                status.textContent = '❌ ' + (data.error || 'Something went wrong');
                showToast('❌ ' + data.error, 'error');
            }
        } catch (error) {
            status.className = 'status error';
            status.textContent = '❌ Network error: ' + error.message;
            showToast('❌ Network error', 'error');
        }

        btn.disabled = false;
        btn.innerHTML = mode === 'login' ? 'Sign In' : 'Register';
    }

    function showUser(userData) {
        document.getElementById('authCard').style.display = 'none';
        document.getElementById('userInfo').style.display = 'block';
        document.getElementById('userName').textContent = userData.name || userData.email;
        document.getElementById('userEmail').textContent = userData.email;
        document.getElementById('dashboardContent').classList.remove('hidden');
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        token = null;
        user = null;
        document.getElementById('authCard').style.display = 'block';
        document.getElementById('userInfo').style.display = 'none';
        document.getElementById('dashboardContent').classList.add('hidden');
        showToast('✅ Logged out', 'success');
    }

    // ==========================================
    // DASHBOARD
    // ==========================================
    async function loadDashboard() {
        await loadSoil();
        await loadHubs();
    }

    async function loadSoil() {
        try {
            const data = await apiRequest('/api/soil/latest');
            if (data && data.value) {
                document.getElementById('soilValue').textContent = data.value;
                document.getElementById('soilTime').textContent = 'Updated: ' + new Date(data.timestamp).toLocaleTimeString();
                document.getElementById('soilStatus').textContent = 'Online';
                document.getElementById('soilStatus').className = 'badge online';
            }
        } catch (error) {
            document.getElementById('soilStatus').textContent = 'Offline';
            document.getElementById('soilStatus').className = 'badge offline';
        }
    }

    async function loadHubs() {
        const container = document.getElementById('hubList');
        container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading hubs...</div>';
        
        try {
            const hubs = await apiRequest('/api/hubs');
            
            if (hubs.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:#6b7280;">No hubs configured yet</div>';
                return;
            }
            
            container.innerHTML = hubs.map(hub => `
                <div class="hub-item">
                    <div>
                        <span class="hub-name">${hub.name || hub.hub_id}</span>
                        <span class="badge ${hub.status === 'online' ? 'online' : 'offline'}">
                            ${hub.status || 'offline'}
                        </span>
                    </div>
                    <div>
                        <span class="hub-id">${hub.hub_id}</span>
                        ${hub.ip_address ? `<span class="hub-ip">· ${hub.ip_address}</span>` : ''}
                    </div>
                </div>
            `).join('');
            
        } catch (error) {
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#f87171;">❌ Failed to load hubs</div>';
        }
    }

    // ==========================================
    // CHECK SESSION
    // ==========================================
    function checkSession() {
        if (token && user) {
            showUser(user);
            loadDashboard();
        }
    }

    // ==========================================
    // INIT
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
        initGoogleSSO();
        checkSession();
        setMode('login');
        
        // Auto-refresh soil every 30 seconds
        setInterval(() => {
            if (token) loadSoil();
        }, 30000);
    });
</script>
</body>
</html>

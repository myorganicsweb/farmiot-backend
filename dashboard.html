<!DOCTYPE html>
<html>
<head>
  <title>FarmIOT Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #121212; color: #fff; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin: 10px auto; max-width: 400px; }
    .online { color: #4CAF50; }
    .offline { color: #f44336; }
    .debug { font-size: 12px; color: #888; font-family: monospace; margin-top: 20px; }
  </style>
</head>
<body>

  <h1>🚜 FarmIOT Status</h1>

  <div class="card">
    <h2 id="statusBadge" class="offline">● OFFLINE</h2>
    <p>Soil Moisture: <span id="soilDisplay">--%</span></p>
    <p>Last Update (Server Time): <span id="lastUpdateDisplay">---</span></p>
  </div>

  <div class="debug">
    Auto-refreshes every 5 seconds
  </div>

  <script>
    async function check() {
      try {
        const res = await fetch('/api/esp32/status');
        const data = await res.json();
        
        const badge = document.getElementById('statusBadge');
        badge.innerText = data.online ? '● ONLINE' : '● OFFLINE';
        badge.className = data.online ? 'online' : 'offline';

        // Show the timestamp the server sees
        document.getElementById('lastUpdateDisplay').innerText = 
          data.lastUpdate ? new Date(data.lastUpdate).toLocaleTimeString() : 'never';
      } catch (e) {
        console.error(e);
      }

      try {
        const res = await fetch('/api/esp32/soil');
        const data = await res.json();
        const raw = data.moisture || 0;
        const percent = Math.min(100, Math.max(0, (1 - (raw / 4095)) * 100));
        document.getElementById('soilDisplay').innerText = percent.toFixed(0) + '%';
      } catch (e) {
        document.getElementById('soilDisplay').innerText = '--%';
      }
    }

    setInterval(check, 5000);
    check();
  </script>

</body>
</html>

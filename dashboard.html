<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmIOT</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            color: #e5e7eb;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 .subtitle {
            font-size: 12px;
            color: #6b7280;
            -webkit-text-fill-color: #6b7280;
            font-weight: 400;
        }
        
        .user-profile {
            position: relative;
            cursor: pointer;
        }
        .user-profile .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(74,222,128,0.15);
            border: 2px solid rgba(74,222,128,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s;
        }
        .user-profile .avatar:hover {
            border-color: #4ade80;
        }
        .user-profile .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-dropdown {
            position: absolute;
            top: 44px;
            right: 0;
            background: #1a1f2e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 0;
            min-width: 280px;
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .user-dropdown.active { display: block; }
        .user-dropdown .user-info {
            padding: 0 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .user-dropdown .user-info .name {
            font-weight: 600;
            font-size: 14px;
        }
        .user-dropdown .user-info .email {
            font-size: 12px;
            color: #6b7280;
        }
        .user-dropdown .divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 6px 12px;
        }
        .user-dropdown .dropdown-item {
            padding: 8px 16px;
            font-size: 13px;
            color: #e5e7eb;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .user-dropdown .dropdown-item:hover {
            background: rgba(255,255,255,0.04);
        }
        .user-dropdown .dropdown-item.danger { color: #f87171; }
        .user-dropdown .dropdown-item.danger:hover { background: rgba(248,113,113,0.1); }
        .user-dropdown .dropdown-item select {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px;
            color: #e5e7eb;
            padding: 4px 8px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            margin-left: auto;
        }
        .user-dropdown .dropdown-item select:focus {
            outline: none;
            border-color: #4ade80;
        }
        
        .search-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }
        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #e5e7eb;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .search-bar input:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74,222,128,0.08);
        }
        .search-bar input::placeholder { color: #4b5563; }
        .search-bar .stats {
            font-size: 12px;
            color: #6b7280;
            white-space: nowrap;
        }
        .search-bar .refresh-indicator {
            font-size: 11px;
            color: #4b5563;
            white-space: nowrap;
        }
        
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            color: #0a0e17;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(74,222,128,0.2); }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #9ca3af;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-success {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.15);
        }
        .btn-success:hover { background: rgba(74,222,128,0.25); }
        .btn-danger {
            background: rgba(248,113,113,0.1);
            color: #f87171;
            border: 1px solid rgba(248,113,113,0.15);
        }
        .btn-danger:hover { background: rgba(248,113,113,0.2); }
        .btn-warning {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.15);
        }
        .btn-warning:hover { background: rgba(251,191,36,0.25); }
        .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
        
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge.online { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.15); }
        .badge.offline { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.15); }
        .badge.pairing { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.15); }
        .badge.linked { background: rgba(96,165,250,0.15); color: #60a5fa; border: 1px solid rgba(96,165,250,0.15); }
        .badge .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: inline-block;
        }
        .badge.online .dot { background: #4ade80; animation: pulse 2s infinite; }
        .badge.pairing .dot { background: #fbbf24; animation: pulse 1.5s infinite; }
        .badge.offline .dot { background: #f87171; }
        .badge.linked .dot { background: #60a5fa; animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }
        .device-card {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
            position: relative;
        }
        .device-card:hover {
            border-color: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }
        .device-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .device-card .device-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }
        .device-card .device-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .device-card .device-id {
            font-size: 10px;
            color: #4b5563;
            font-family: monospace;
            margin-bottom: 6px;
        }
        .device-card .device-soil {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .device-card .device-soil .value {
            font-size: 20px;
            font-weight: 700;
            color: #fbbf24;
        }
        .device-card .device-soil .unit {
            font-size: 12px;
            color: #6b7280;
        }
        .device-card .device-soil .mini-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .device-card .device-soil .mini-bar .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #f87171, #fbbf24, #4ade80);
            transition: width 0.8s ease;
            width: 45%;
        }
        .device-card .device-details {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .device-card .device-details .detail {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .device-card .device-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 10px;
        }
        
        .discovered-card {
            border: 2px solid rgba(251,191,36,0.2);
            background: rgba(251,191,36,0.03);
            padding: 14px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .discovered-card .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .discovered-card .info .icon { font-size: 22px; }
        
        .ble-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .ble-status.connected { background: rgba(74,222,128,0.15); color: #4ade80; }
        .ble-status.disconnected { background: rgba(248,113,113,0.15); color: #f87171; }
        .ble-status.scanning { background: rgba(251,191,36,0.15); color: #fbbf24; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
        .empty-state .title { font-size: 16px; font-weight: 600; color: #e5e7eb; }
        .empty-state .sub { font-size: 13px; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1f2e;
            border-radius: 20px;
            padding: 28px;
            max-width: 440px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.06);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 { font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .modal-content .sub { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 13px;
            font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: #4ade80; }
        .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
        .modal-actions .btn { flex: 1; justify-content: center; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 16px;
            border-radius: 10px;
            background: rgba(17,24,39,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e5e7eb;
            font-size: 13px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            max-width: 90%;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 3px solid #4ade80; }
        .toast.error { border-left: 3px solid #f87171; }
        .toast.warning { border-left: 3px solid #fbbf24; }
        
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 20px; color: #6b7280; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .device-grid { grid-template-columns: 1fr; }
            .search-bar { flex-direction: column; align-items: stretch; }
            .search-bar .stats { text-align: right; }
            .user-dropdown { right: -20px; min-width: 260px; }
        }
        
        #googleBtn {
            display: flex;
            justify-content: center;
            margin: 8px 0 12px 0;
            min-height: 40px;
        }
        #googleBtn iframe {
            margin: 0 auto !important;
        }
        
        .device-type-badge {
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            color: #6b7280;
            margin-left: 4px;
        }
        .device-type-badge.hub { color: #4ade80; border: 1px solid rgba(74,222,128,0.15); }
        .device-type-badge.sensor { color: #60a5fa; border: 1px solid rgba(96,165,250,0.15); }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <h1>🌿 FarmIOT <span class="subtitle">Smart Agriculture</span></h1>
        </div>
        <div class="user-profile" id="userProfile">
            <div class="avatar" id="avatarBtn" onclick="toggleDropdown()">
                <span id="avatarText">👤</span>
                <img id="avatarImg" style="display:none;" alt="Profile">
            </div>
            <div class="user-dropdown" id="userDropdown">
                <div class="user-info">
                    <div class="name" id="dropdownName">User</div>
                    <div class="email" id="dropdownEmail">user@example.com</div>
                </div>
                <div class="divider"></div>
                
                <div class="dropdown-item">
                    <span>🔄 Active UI Refresh</span>
                    <select id="activeRefreshRate" onchange="saveRefreshSettings()">
                        <option value="5">5 sec</option>
                        <option value="30">30 sec</option>
                        <option value="60">1 min</option>
                        <option value="120">2 min</option>
                        <option value="300">5 min</option>
                        <option value="1800">30 min</option>
                        <option value="3600">1 hr</option>
                        <option value="10800">3 hr</option>
                        <option value="21600">6 hr</option>
                        <option value="43200">12 hr</option>
                        <option value="86400">24 hr</option>
                    </select>
                </div>
                <div class="dropdown-item">
                    <span>💤 Inactive UI Refresh</span>
                    <select id="inactiveRefreshRate" onchange="saveRefreshSettings()">
                        <option value="5">5 sec</option>
                        <option value="30">30 sec</option>
                        <option value="60">1 min</option>
                        <option value="120">2 min</option>
                        <option value="300">5 min</option>
                        <option value="1800">30 min</option>
                        <option value="3600">1 hr</option>
                        <option value="10800">3 hr</option>
                        <option value="21600">6 hr</option>
                        <option value="43200">12 hr</option>
                        <option value="86400">24 hr</option>
                    </select>
                </div>
                <div class="dropdown-item" style="font-size:11px;color:#4b5563;padding:4px 16px;">
                    <span>⏱️ Next refresh in: <span id="nextRefreshCountdown">--</span></span>
                </div>
                
                <div class="divider"></div>
                <button class="dropdown-item" onclick="forceRefreshNow()">🔄 Refresh Now</button>
                <button class="dropdown-item danger" onclick="logoutUser()">🚪 Sign Out</button>
            </div>
        </div>
    </div>

    <!-- AUTH CARD -->
    <div id="authSection">
        <div class="card auth-card" id="signinCard" style="background:rgba(17,24,39,0.9);padding:32px;border-radius:20px;border:1px solid rgba(255,255,255,0.06);max-width:420px;margin:0 auto;">
            <h2 style="font-size:20px;text-align:center;">🌿 Welcome to FarmIOT</h2>
            <p style="text-align:center;color:#6b7280;font-size:14px;margin-bottom:8px;">Sign in to manage your smart farm devices</p>
            <div id="googleBtn"></div>
            <div style="display:flex;align-items:center;margin:12px 0;color:#374151;font-size:12px;">
                <span style="flex:1;border-bottom:1px solid rgba(255,255,255,0.06);"></span>
                <span style="padding:0 12px;">or</span>
                <span style="flex:1;border-bottom:1px solid rgba(255,255,255,0.06);"></span>
            </div>
            <div style="text-align:left;">
                <div style="display:flex;gap:4px;background:rgba(255,255,255,0.03);border-radius:8px;padding:3px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.04);">
                    <button class="active" id="loginTab" onclick="setAuthMode('login')" style="flex:1;padding:6px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#6b7280;font-family:inherit;">Sign In</button>
                    <button id="registerTab" onclick="setAuthMode('register')" style="flex:1;padding:6px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#6b7280;font-family:inherit;">Register</button>
                </div>
                <form id="authForm" onsubmit="handleAuthSubmit(event)">
                    <div class="form-group">
                        <label>📧 Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>🔒 Password</label>
                        <input type="password" id="password" placeholder="Enter your password" minlength="6" required>
                    </div>
                    <div class="form-group" id="confirmGroup" style="display:none;">
                        <label>🔒 Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;padding:10px;justify-content:center;">Sign In</button>
                </form>
                <div id="authStatus" style="margin-top:10px;padding:8px;border-radius:8px;font-size:13px;display:none;"></div>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardContent" class="hidden">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search devices by name or ID..." oninput="filterDevices()">
            <button class="btn btn-primary btn-sm" onclick="scanForDevices()">🔍 Scan</button>
            <button class="btn btn-secondary btn-sm" onclick="loadDevices()">🔄 Refresh</button>
            <span id="bleStatus" class="ble-status disconnected">⚪ Offline</span>
            <span class="stats" id="deviceCount"></span>
            <span class="refresh-indicator" id="refreshIndicator">⏱️ Refresh in: --</span>
        </div>

        <div id="deviceGrid" class="device-grid">
            <div class="loading"><div class="spinner"></div>Loading devices...</div>
        </div>
    </div>
</div>

<!-- CONFIG MODAL -->
<div class="modal" id="configModal">
    <div class="modal-content">
        <h2>⚙️ Configure Device</h2>
        <div class="sub" id="configHubInfo">
            Configuring: <strong id="configHubId">—</strong>
            <span id="configHubStatus" style="color:#6b7280;font-size:12px;display:block;margin-top:4px;"></span>
        </div>
        <div class="form-group">
            <label>📶 WiFi SSID</label>
            <input type="text" id="configSSID" placeholder="Enter WiFi SSID" required>
        </div>
        <div class="form-group">
            <label>🔑 WiFi Password</label>
            <input type="password" id="configPassword" placeholder="Enter WiFi password" required>
        </div>
        <div class="form-group">
            <label>🏷️ Device Name</label>
            <input type="text" id="configDeviceName" placeholder="My Device">
        </div>
        <div class="form-group" id="hubSelectGroup">
            <label>🔗 Link to Hub</label>
            <select id="hubSelect" style="width:100%;padding:8px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:#e5e7eb;font-size:13px;font-family:inherit;">
                <option value="">Select a hub...</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal('configModal')">Cancel</button>
            <button class="btn btn-primary" id="configSaveBtn" onclick="saveDeviceConfig()">💾 Save</button>
        </div>
    </div>
</div>

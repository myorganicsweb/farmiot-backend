<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmIOT - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            color: #e5e7eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-left .subtitle { color: #6b7280; font-size: 14px; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        
        .auth-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }
        .auth-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .user-info { color: #6b7280; font-size: 14px; }
        .user-info strong { color: #e5e7eb; }
        
        .auth-toggle {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .auth-toggle button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            color: #6b7280;
            font-family: inherit;
        }
        .auth-toggle button.active {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
        }
        .auth-toggle button:hover { color: #e5e7eb; }
        
        .auth-forms {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .auth-forms input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.04);
            color: #e5e7eb;
            font-size: 13px;
            font-family: inherit;
            min-width: 140px;
        }
        .auth-forms input:focus { outline: none; border-color: #4ade80; }
        .auth-forms input::placeholder { color: #4b5563; }
        .auth-divider { color: #374151; font-size: 12px; padding: 0 4px; }
        .auth-hint { font-size: 12px; color: #4b5563; margin-top: 4px; }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            color: #0a0e17;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(74,222,128,0.2); }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: #9ca3af;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); }
        .btn-success {
            background: rgba(74,222,128,0.1);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.15);
        }
        .btn-success:hover { background: rgba(74,222,128,0.2); }
        .btn-danger {
            background: rgba(248,113,113,0.1);
            color: #f87171;
            border: 1px solid rgba(248,113,113,0.15);
        }
        .btn-danger:hover { background: rgba(248,113,113,0.2); }
        .btn-logout {
            background: rgba(248,113,113,0.1);
            color: #f87171;
            border: 1px solid rgba(248,113,113,0.15);
            padding: 4px 12px;
            font-size: 12px;
        }
        .btn-logout:hover { background: rgba(248,113,113,0.2); }
        
        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .tab {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            color: #6b7280;
            font-family: inherit;
            flex: 1;
            text-align: center;
        }
        .tab:hover { color: #e5e7eb; }
        .tab.active {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
        }
        .tab .badge {
            display: inline-block;
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 6px;
        }
        .tab .badge.online { background: rgba(74,222,128,0.15); color: #4ade80; }
        
        .card {
            background: rgba(17, 24, 39, 0.9);
            padding: 20px;
            border-radius: 16px;
            margin: 12px 0;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
        }
        .card:hover { border-color: rgba(74,222,128,0.15); }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-subtitle { font-size: 13px; color: #6b7280; }
        
        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-status.online {
            background: rgba(74,222,128,0.1);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.15);
        }
        .badge-status.offline {
            background: rgba(248,113,113,0.1);
            color: #f87171;
            border: 1px solid rgba(248,113,113,0.15);
        }
        .badge-status.discovering {
            background: rgba(251,191,36,0.1);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.15);
        }
        .badge-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .badge-status.online .dot { background: #4ade80; animation: pulse 1.5s infinite; }
        .badge-status.offline .dot { background: #f87171; }
        .badge-status.discovering .dot { background: #fbbf24; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .discovery-card {
            background: rgba(251,191,36,0.03);
            border: 1px solid rgba(251,191,36,0.1);
        }
        .discovery-card:hover { border-color: rgba(251,191,36,0.2); }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1f2e;
            border-radius: 20px;
            padding: 32px;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.06);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 { margin-bottom: 16px; font-size: 22px; }
        .modal-content .form-group { margin-bottom: 14px; }
        .modal-content label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .modal-content input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #e5e7eb;
            font-size: 14px;
            font-family: inherit;
        }
        .modal-content input:focus { outline: none; border-color: #4ade80; }
        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions .btn { flex: 1; justify-content: center; }
        .modal .device-info {
            background: rgba(255,255,255,0.03);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #6b7280;
        }
        .modal .device-info strong { color: #e5e7eb; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(17,24,39,0.95);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e5e7eb;
            font-size: 14px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            max-width: 90%;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 3px solid #4ade80; }
        .toast.error { border-left: 3px solid #f87171; }
        .toast.info { border-left: 3px solid #60a5fa; }
        .toast.warning { border-left: 3px solid #fbbf24; }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state .text { font-size: 16px; }
        .empty-state .sub { font-size: 13px; margin-top: 4px; }
        
        .loading-overlay {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .loading-overlay .spinner {
            width: 40px;
            height: 40px;
            border-width: 3px;
            margin-bottom: 12px;
        }
        
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .tabs { flex-direction: column; }
            .tab { flex: none; }
            .card-header { flex-direction: column; align-items: flex-start; }
            .btn-group { width: 100%; }
            .btn-group .btn { flex: 1; justify-content: center; }
            .auth-section { align-items: flex-start; width: 100%; }
            .auth-row { width: 100%; flex-direction: column; }
            .auth-forms { width: 100%; flex-direction: column; }
            .auth-forms input { width: 100%; min-width: unset; }
            .auth-forms .btn { width: 100%; justify-content: center; }
            .auth-toggle { width: 100%; }
            .auth-toggle button { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-left">
            <h1>🚜 FarmIOT</h1>
            <div class="subtitle" id="liveTime">--:--:--</div>
        </div>
        <div class="header-actions">
            <div class="auth-section" id="authSection">
                <div id="loggedOutState">
                    <div class="auth-row">
                        <div class="auth-toggle">
                            <button class="active" id="loginModeBtn" onclick="setAuthMode('login')">Sign In</button>
                            <button id="registerModeBtn" onclick="setAuthMode('register')">Register</button>
                        </div>
                        <div class="auth-forms" id="authForms">
                            <input type="email" id="emailInput" placeholder="Email" autocomplete="email">
                            <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
                            <input type="password" id="confirmPasswordInput" placeholder="Confirm Password" style="display:none;" autocomplete="new-password">
                            <button class="btn btn-primary" id="authActionBtn" onclick="handleAuthAction()">Sign In</button>
                        </div>
                    </div>
                    <div class="auth-hint" id="authHint">💡 New user? Switch to Register above to create an account.</div>
                </div>
                
                <div id="loggedInState" style="display:none;">
                    <div class="auth-row">
                        <span class="user-info">👋 <strong id="userName">User</strong></span>
                        <button class="btn btn-logout" onclick="logout()">Sign Out</button>
                        <button class="btn btn-primary" onclick="scanForHubs()">🔍 Scan</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" id="tabDevices" onclick="switchTab('devices')">
            📡 My Devices <span class="badge online" id="deviceCount">0</span>
        </button>
        <button class="tab" id="tabDiscovery" onclick="switchTab('discovery')">
            🔍 Discovery <span class="badge" id="discoveryCount">0</span>
        </button>
    </div>

    <div id="devicesTab">
        <div id="devicesList">
            <div class="loading-overlay">
                <div class="spinner"></div>
                <div>Loading devices...</div>
            </div>
        </div>
    </div>

    <div id="discoveryTab" style="display:none;">
        <div id="discoveryList">
            <div class="empty-state">
                <div class="icon">🔍</div>
                <div class="text">Click "Scan" to find devices in discovery mode</div>
            </div>
        </div>
    </div>
</div>

<!-- Config Modal -->
<div class="modal" id="configModal">
    <div class="modal-content">
        <h2 id="configModalTitle">⚙️ Configure Device</h2>
        <div class="device-info" id="configDeviceInfo">
            Device: <strong id="configDeviceId">—</strong><br>
            Status: <span id="configDeviceStatus">—</span>
        </div>
        <div class="form-group">
            <label>WiFi SSID</label>
            <input type="text" id="configSSID" placeholder="Enter WiFi name">
        </div>
        <div class="form-group">
            <label>WiFi Password</label>
            <input type="password" id="configPassword" placeholder="Enter WiFi password">
        </div>
        <div class="form-group">
            <label>Device Name</label>
            <input type="text" id="configDeviceName" placeholder="My Hub" value="farmiot-hub">
        </div>
        <div class="form-group">
            <label>MQTT Server</label>
            <input type="text" id="configMQTT" placeholder="broker.hivemq.com" value="broker.hivemq.com">
        </div>
        <div class="form-group">
            <label>MQTT Port</label>
            <input type="number" id="configMQTTPort" placeholder="1883" value="1883">
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal('configModal')">Cancel</button>
            <button class="btn btn-primary" id="configSaveBtn" onclick="saveConfig()">💾 Save</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ==========================================
    // CONFIG
    // ==========================================
    const API_BASE = window.location.origin;
    let token = localStorage.getItem('farmiot_token') || null;
    let user = null;
    let isLoggedIn = false;
    let authMode = 'login';
    let discoveredDevices = [];
    let configuredDevices = [];
    let currentConfigDevice = null;
    let isReconfigure = false;

    // ==========================================
    // AUTH UI TOGGLE
    // ==========================================
    function setAuthMode(mode) {
        authMode = mode;
        const loginBtn = document.getElementById('loginModeBtn');
        const registerBtn = document.getElementById('registerModeBtn');
        const confirmInput = document.getElementById('confirmPasswordInput');
        const actionBtn = document.getElementById('authActionBtn');
        const hint = document.getElementById('authHint');
        
        if (mode === 'login') {
            loginBtn.classList.add('active');
            registerBtn.classList.remove('active');
            confirmInput.style.display = 'none';
            actionBtn.textContent = 'Sign In';
            hint.textContent = '💡 New user? Switch to Register above.';
        } else {
            registerBtn.classList.add('active');
            loginBtn.classList.remove('active');
            confirmInput.style.display = 'block';
            actionBtn.textContent = 'Register';
            hint.textContent = '💡 Already have an account? Switch to Sign In above.';
        }
    }

    // ==========================================
    // EMAIL/PASSWORD AUTH
    // ==========================================
    async function handleAuthAction() {
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const confirmPassword = document.getElementById('confirmPasswordInput').value.trim();
        
        if (!email || !password) {
            showToast('❌ Please enter email and password', 'error');
            return;
        }
        
        if (password.length < 6) {
            showToast('❌ Password must be at least 6 characters', 'error');
            return;
        }
        
        if (authMode === 'register') {
            if (password !== confirmPassword) {
                showToast('❌ Passwords do not match', 'error');
                return;
            }
            await registerUser(email, password);
        } else {
            await loginUser(email, password);
        }
    }

    async function registerUser(email, password) {
        const btn = document.getElementById('authActionBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Creating account...';
        
        try {
            showToast('🔄 Creating account...', 'info');
            
            const res = await fetch(`${API_BASE}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await res.json();
            
            if (data.success) {
                token = data.token;
                user = data.user;
                localStorage.setItem('farmiot_token', token);
                isLoggedIn = true;
                updateAuthUI(data.user);
                showToast('✅ Account created! Welcome!', 'success');
                loadConfiguredDevices();
                scanForHubs();
                clearAuthForm();
            } else {
                showToast('❌ ' + (data.error || 'Registration failed'), 'error');
            }
        } catch (error) {
            console.error('Registration error:', error);
            showToast('❌ Error: ' + error.message, 'error');
        }
        
        btn.disabled = false;
        btn.innerHTML = authMode === 'register' ? 'Register' : 'Sign In';
    }

    async function loginUser(email, password) {
        const btn = document.getElementById('authActionBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Signing in...';
        
        try {
            showToast('🔄 Signing in...', 'info');
            
            const res = await fetch(`${API_BASE}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await res.json();
            
            if (data.success) {
                token = data.token;
                user = data.user;
                localStorage.setItem('farmiot_token', token);
                isLoggedIn = true;
                updateAuthUI(data.user);
                showToast('✅ Welcome back, ' + data.user.name + '!', 'success');
                loadConfiguredDevices();
                scanForHubs();
                clearAuthForm();
            } else {
                showToast('❌ ' + (data.error || 'Login failed'), 'error');
            }
        } catch (error) {
            console.error('Login error:', error);
            showToast('❌ Error: ' + error.message, 'error');
        }
        
        btn.disabled = false;
        btn.innerHTML = authMode === 'register' ? 'Register' : 'Sign In';
    }

    function clearAuthForm() {
        document.getElementById('emailInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('confirmPasswordInput').value = '';
    }

    async function logout() {
        try {
            await fetch(`${API_BASE}/api/auth/logout`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
        } catch (e) {}
        
        token = null;
        user = null;
        isLoggedIn = false;
        localStorage.removeItem('farmiot_token');
        updateAuthUI(null);
        showToast('✅ Logged out', 'success');
    }

    function updateAuthUI(userData) {
        const loggedOutState = document.getElementById('loggedOutState');
        const loggedInState = document.getElementById('loggedInState');
        const userName = document.getElementById('userName');
        
        if (userData) {
            loggedOutState.style.display = 'none';
            loggedInState.style.display = 'block';
            userName.textContent = userData.name || userData.email || 'User';
            isLoggedIn = true;
        } else {
            loggedOutState.style.display = 'block';
            loggedInState.style.display = 'none';
            isLoggedIn = false;
            setAuthMode('login');
        }
    }

    // ==========================================
    // FETCH WITH AUTH
    // ==========================================
    async function fetchWithAuth(url, options = {}) {
        const headers = {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
            ...options.headers
        };
        
        const response = await fetch(url, { ...options, headers });
        
        if (response.status === 401) {
            token = null;
            localStorage.removeItem('farmiot_token');
            isLoggedIn = false;
            updateAuthUI(null);
            showToast('⚠️ Session expired. Please sign in again.', 'warning');
            throw new Error('Unauthorized');
        }
        
        return response;
    }

    // ==========================================
    // CHECK SESSION
    // ==========================================
    async function checkSession() {
        if (!token) {
            updateAuthUI(null);
            return;
        }
        
        try {
            const res = await fetch(`${API_BASE}/api/auth/verify`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (res.ok) {
                const data = await res.json();
                if (data.success) {
                    user = data.user;
                    isLoggedIn = true;
                    updateAuthUI(data.user);
                    loadConfiguredDevices();
                    scanForHubs();
                    return;
                }
            }
            
            token = null;
            localStorage.removeItem('farmiot_token');
            updateAuthUI(null);
        } catch (error) {
            console.error('Session check error:', error);
            token = null;
            localStorage.removeItem('farmiot_token');
            updateAuthUI(null);
        }
    }

    // ==========================================
    // TOAST
    // ==========================================
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + type + ' show';
        clearTimeout(toast._hide);
        toast._hide = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ==========================================
    // TABS
    // ==========================================
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('devicesTab').style.display = tab === 'devices' ? 'block' : 'none';
        document.getElementById('discoveryTab').style.display = tab === 'discovery' ? 'block' : 'none';
        document.getElementById('tabDevices').classList.toggle('active', tab === 'devices');
        document.getElementById('tabDiscovery').classList.toggle('active', tab === 'discovery');
        
        if (tab === 'discovery' && isLoggedIn) {
            scanForHubs();
        }
    }

    // ==========================================
    // MODAL
    // ==========================================
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });
    });

    // ==========================================
    // SCAN FOR HUBS
    // ==========================================
    async function scanForHubs() {
        if (!isLoggedIn) {
            showToast('⚠️ Please sign in first', 'warning');
            return;
        }
        
        showToast('🔍 Scanning for devices...', 'info');
        
        try {
            const response = await fetchWithAuth(`${API_BASE}/api/discover`);
            if (response.ok) {
                const hubs = await response.json();
                discoveredDevices = hubs.filter(h => h.status === 'discovering' || h.status === 'offline');
                renderDiscoveryList(discoveredDevices);
                
                if (discoveredDevices.length === 0) {
                    showToast('🔍 No devices in discovery mode found', 'info');
                } else {
                    showToast(`✅ Found ${discoveredDevices.length} device(s)`, 'success');
                }
            }
        } catch (error) {
            console.error('Scan error:', error);
            showToast('❌ Scan failed', 'error');
        }
    }

    // ==========================================
    // RENDER DISCOVERY LIST
    // ==========================================
    function renderDiscoveryList(devices) {
        const container = document.getElementById('discoveryList');
        const count = document.getElementById('discoveryCount');
        count.textContent = devices.length;
        
        if (devices.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">🔍</div>
                    <div class="text">No devices in discovery mode</div>
                    <div class="sub">Make sure your ESP32 is powered on and in AP mode</div>
                    <button class="btn btn-primary" style="margin-top:12px;" onclick="scanForHubs()">🔄 Scan Again</button>
                </div>
            `;
            return;
        }

        container.innerHTML = devices.map(device => `
            <div class="card discovery-card">
                <div class="card-header">
                    <div>
                        <div class="card-title">
                            📡 ${device.name || device.device_id}
                            <span class="badge-status discovering">
                                <span class="dot"></span> DISCOVERING
                            </span>
                        </div>
                        <div class="card-subtitle">
                            ID: ${device.device_id} · IP: ${device.ip_address || 'Unknown'}
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="openConfigForDevice('${device.device_id}', false)">
                            ⚙️ Configure
                        </button>
                    </div>
                </div>
                <div style="margin-top:8px;font-size:12px;color:#6b7280;">
                    💡 Click "Configure" to set up WiFi and add to your devices
                </div>
            </div>
        `).join('');
    }

    // ==========================================
    // RENDER CONFIGURED DEVICES
    // ==========================================
    function renderConfiguredDevices(devices) {
        const container = document.getElementById('devicesList');
        const count = document.getElementById('deviceCount');
        count.textContent = devices.length;
        
        if (devices.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📡</div>
                    <div class="text">No devices configured yet</div>
                    <div class="sub">Go to the Discovery tab to find and configure your hubs</div>
                </div>
            `;
            return;
        }

        container.innerHTML = devices.map(device => `
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">
                            📡 ${device.name || device.device_id}
                            <span class="badge-status ${device.status === 'online' ? 'online' : 'offline'}">
                                <span class="dot"></span> ${device.status === 'online' ? 'ONLINE' : 'OFFLINE'}
                            </span>
                        </div>
                        <div class="card-subtitle">
                            ID: ${device.device_id} · IP: ${device.ip_address || 'Unknown'}
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn-icon" onclick="openConfigForDevice('${device.device_id}', true)" title="Reconfigure">
                            ⚙️
                        </button>
                        <button class="btn-icon" onclick="rebootDevice('${device.device_id}')" title="Reboot">
                            🔄
                        </button>
                        <button class="btn-icon" onclick="removeDevice('${device.device_id}')" title="Remove" style="color:#f87171;">
                            🗑️
                        </button>
                    </div>
                </div>
                ${device.latest_soil ? `
                    <div style="margin-top:8px;display:flex;gap:16px;font-size:13px;color:#6b7280;">
                        <span>🌱 Soil: <strong style="color:#fbbf24;">${device.latest_soil}</strong></span>
                        <span>📅 Last seen: ${device.last_seen ? new Date(device.last_seen).toLocaleTimeString() : 'Never'}</span>
                    </div>
                ` : ''}
            </div>
        `).join('');
    }

    // ==========================================
    // OPEN CONFIG MODAL
    // ==========================================
    function openConfigForDevice(deviceId, isReconfig) {
        if (!isLoggedIn) {
            showToast('⚠️ Please sign in first', 'warning');
            return;
        }
        
        isReconfigure = isReconfig;
        currentConfigDevice = deviceId;
        
        document.getElementById('configModalTitle').textContent = isReconfig ? '⚙️ Reconfigure Device' : '⚙️ Configure Device';
        document.getElementById('configDeviceId').textContent = deviceId;
        document.getElementById('configDeviceStatus').textContent = isReconfig ? 'Configured' : 'Discovery Mode';
        document.getElementById('configSSID').value = '';
        document.getElementById('configPassword').value = '';
        document.getElementById('configDeviceName').value = 'farmiot-hub';
        document.getElementById('configMQTT').value = 'broker.hivemq.com';
        document.getElementById('configMQTTPort').value = '1883';
        
        if (isReconfig) {
            fetchConfig(deviceId);
        }
        
        openModal('configModal');
    }

    // ==========================================
    // FETCH EXISTING CONFIG
    // ==========================================
    async function fetchConfig(deviceId) {
        try {
            const response = await fetchWithAuth(`${API_BASE}/api/hubs/${deviceId}/config`);
            if (response.ok) {
                const data = await response.json();
                document.getElementById('configSSID').value = data.ssid || '';
                document.getElementById('configDeviceName').value = data.device_name || 'farmiot-hub';
                document.getElementById('configMQTT').value = data.mqtt_server || 'broker.hivemq.com';
                document.getElementById('configMQTTPort').value = data.mqtt_port || 1883;
            }
        } catch (error) {
            console.error('Error fetching config:', error);
        }
    }

    // ==========================================
    // SAVE CONFIG
    // ==========================================
    async function saveConfig() {
        if (!isLoggedIn) {
            showToast('⚠️ Please sign in first', 'warning');
            return;
        }
        
        const deviceId = currentConfigDevice;
        const ssid = document.getElementById('configSSID').value.trim();
        const password = document.getElementById('configPassword').value.trim();
        const name = document.getElementById('configDeviceName').value.trim() || 'farmiot-hub';
        const mqtt = document.getElementById('configMQTT').value.trim() || 'broker.hivemq.com';
        const port = parseInt(document.getElementById('configMQTTPort').value) || 1883;

        if (!ssid) {
            showToast('❌ WiFi SSID is required', 'error');
            return;
        }

        const btn = document.getElementById('configSaveBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Saving...';

        try {
            const response = await fetchWithAuth(`${API_BASE}/api/hubs/${deviceId}/config`, {
                method: 'POST',
                body: JSON.stringify({
                    ssid: ssid,
                    password: password,
                    mqtt_server: mqtt,
                    mqtt_port: port,
                    device_name: name
                })
            });

            const result = await response.json();
            
            if (result.success) {
                showToast('✅ Config saved! Device will reboot and connect.', 'success');
                closeModal('configModal');
                
                if (!isReconfigure) {
                    discoveredDevices = discoveredDevices.filter(d => d.device_id !== deviceId);
                    renderDiscoveryList(discoveredDevices);
                    document.getElementById('discoveryCount').textContent = discoveredDevices.length;
                }
                
                setTimeout(loadConfiguredDevices, 3000);
            } else {
                showToast('❌ ' + (result.error || 'Failed to save'), 'error');
            }
        } catch (error) {
            showToast('❌ Error: ' + error.message, 'error');
        }

        btn.disabled = false;
        btn.innerHTML = '💾 Save';
    }

    // ==========================================
    // LOAD CONFIGURED DEVICES
    // ==========================================
    async function loadConfiguredDevices() {
        if (!isLoggedIn) {
            return;
        }
        
        try {
            const response = await fetchWithAuth(`${API_BASE}/api/hubs`);
            if (response.ok) {
                const hubs = await response.json();
                configuredDevices = hubs;
                renderConfiguredDevices(hubs);
            }
        } catch (error) {
            console.error('Error loading devices:', error);
        }
    }

    // ==========================================
    // REBOOT DEVICE
    // ==========================================
    async function rebootDevice(deviceId) {
        if (!isLoggedIn) {
            showToast('⚠️ Please sign in first', 'warning');
            return;
        }
        
        if (!confirm(`Reboot ${deviceId}?`)) return;
        
        showToast('🔄 Rebooting device...', 'info');
        try {
            const response = await fetchWithAuth(`${API_BASE}/api/hubs/${deviceId}/reboot`, {
                method: 'POST'
            });
            if (response.ok) {
                showToast('✅ Reboot command sent', 'success');
                setTimeout(loadConfiguredDevices, 5000);
            }
        } catch (error) {
            showToast('❌ Error: ' + error.message, 'error');
        }
    }

    // ==========================================
    // REMOVE DEVICE
    // ==========================================
    async function removeDevice(deviceId) {
        if (!isLoggedIn) {
            showToast('⚠️ Please sign in first', 'warning');
            return;
        }
        
        if (!confirm(`Remove ${deviceId} from your devices?`)) return;
        
        try {
            const response = await fetchWithAuth(`${API_BASE}/api/hubs/${deviceId}`, {
                method: 'DELETE'
            });
            if (response.ok) {
                showToast('✅ Device removed', 'success');
                loadConfiguredDevices();
            }
        } catch (error) {
            showToast('❌ Error: ' + error.message, 'error');
        }
    }

    // ==========================================
    // ENTER KEY SUPPORT
    // ==========================================
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            if (authMode === 'register') {
                document.getElementById('confirmPasswordInput').focus();
            } else {
                handleAuthAction();
            }
        }
    });
    document.getElementById('confirmPasswordInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            handleAuthAction();
        }
    });
    document.getElementById('emailInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('passwordInput').focus();
        }
    });

    // ==========================================
    // UPDATE TIME
    // ==========================================
    function updateTime() {
        const now = new Date();
        document.getElementById('liveTime').textContent = now.toLocaleTimeString('en-US', { hour12: false });
    }

    // ==========================================
    // INIT
    // ==========================================
    checkSession();
    updateTime();
    setInterval(updateTime, 1000);
    setInterval(() => {
        if (isLoggedIn) loadConfiguredDevices();
    }, 30000);

    document.getElementById('tabDiscovery').addEventListener('click', () => {
        if (isLoggedIn) {
            setTimeout(scanForHubs, 300);
        }
    });
</script>
</body>
</html>

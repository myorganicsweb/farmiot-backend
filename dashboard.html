<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmIOT</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            color: #e5e7eb;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 .subtitle {
            font-size: 12px;
            color: #6b7280;
            -webkit-text-fill-color: #6b7280;
            font-weight: 400;
        }
        
        /* ===== USER PROFILE DROPDOWN ===== */
        .user-profile {
            position: relative;
            cursor: pointer;
        }
        .user-profile .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(74,222,128,0.15);
            border: 2px solid rgba(74,222,128,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s;
        }
        .user-profile .avatar:hover {
            border-color: #4ade80;
        }
        .user-profile .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-dropdown {
            position: absolute;
            top: 44px;
            right: 0;
            background: #1a1f2e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 0;
            min-width: 200px;
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .user-dropdown.active { display: block; }
        .user-dropdown .user-info {
            padding: 0 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .user-dropdown .user-info .name {
            font-weight: 600;
            font-size: 14px;
        }
        .user-dropdown .user-info .email {
            font-size: 12px;
            color: #6b7280;
        }
        .user-dropdown .divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 6px 12px;
        }
        .user-dropdown .dropdown-item {
            padding: 8px 16px;
            font-size: 13px;
            color: #e5e7eb;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .user-dropdown .dropdown-item:hover {
            background: rgba(255,255,255,0.04);
        }
        .user-dropdown .dropdown-item.danger { color: #f87171; }
        .user-dropdown .dropdown-item.danger:hover { background: rgba(248,113,113,0.1); }
        
        /* ===== SEARCH BAR ===== */
        .search-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }
        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #e5e7eb;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .search-bar input:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74,222,128,0.08);
        }
        .search-bar input::placeholder { color: #4b5563; }
        .search-bar .stats {
            font-size: 12px;
            color: #6b7280;
            white-space: nowrap;
        }
        
        /* ===== BUTTONS ===== */
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            color: #0a0e17;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(74,222,128,0.2); }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #9ca3af;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-success {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.15);
        }
        .btn-success:hover { background: rgba(74,222,128,0.25); }
        .btn-danger {
            background: rgba(248,113,113,0.1);
            color: #f87171;
            border: 1px solid rgba(248,113,113,0.15);
        }
        .btn-danger:hover { background: rgba(248,113,113,0.2); }
        .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
        
        /* ===== BADGES ===== */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge.online { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.15); }
        .badge.offline { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.15); }
        .badge.pairing { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.15); }
        .badge .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: inline-block;
        }
        .badge.online .dot { background: #4ade80; animation: pulse 2s infinite; }
        .badge.pairing .dot { background: #fbbf24; animation: pulse 1.5s infinite; }
        .badge.offline .dot { background: #f87171; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        
        /* ===== DEVICE CARDS (GRID) ===== */
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }
        .device-card {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
            position: relative;
        }
        .device-card:hover {
            border-color: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }
        .device-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .device-card .device-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }
        .device-card .device-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .device-card .device-id {
            font-size: 10px;
            color: #4b5563;
            font-family: monospace;
            margin-bottom: 6px;
        }
        .device-card .device-status {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .device-card .device-soil {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .device-card .device-soil .value {
            font-size: 20px;
            font-weight: 700;
            color: #fbbf24;
        }
        .device-card .device-soil .unit {
            font-size: 12px;
            color: #6b7280;
        }
        .device-card .device-soil .mini-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .device-card .device-soil .mini-bar .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #f87171, #fbbf24, #4ade80);
            transition: width 0.8s ease;
            width: 45%;
        }
        .device-card .device-details {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .device-card .device-details .detail {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .device-card .device-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 10px;
        }
        
        /* ===== DISCOVERED HUB CARD ===== */
        .discovered-card {
            border: 2px solid rgba(251,191,36,0.2);
            background: rgba(251,191,36,0.03);
            padding: 14px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .discovered-card .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .discovered-card .info .icon { font-size: 22px; }
        
        /* ===== BLE STATUS ===== */
        .ble-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .ble-status.connected { background: rgba(74,222,128,0.15); color: #4ade80; }
        .ble-status.disconnected { background: rgba(248,113,113,0.15); color: #f87171; }
        .ble-status.scanning { background: rgba(251,191,36,0.15); color: #fbbf24; }
        
        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
        .empty-state .title { font-size: 16px; font-weight: 600; color: #e5e7eb; }
        .empty-state .sub { font-size: 13px; }
        
        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1f2e;
            border-radius: 20px;
            padding: 28px;
            max-width: 440px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.06);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 { font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .modal-content .sub { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 13px;
            font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: #4ade80; }
        .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
        .modal-actions .btn { flex: 1; justify-content: center; }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 16px;
            border-radius: 10px;
            background: rgba(17,24,39,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e5e7eb;
            font-size: 13px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            max-width: 90%;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 3px solid #4ade80; }
        .toast.error { border-left: 3px solid #f87171; }
        .toast.warning { border-left: 3px solid #fbbf24; }
        
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 20px; color: #6b7280; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .device-grid { grid-template-columns: 1fr; }
            .search-bar { flex-direction: column; align-items: stretch; }
            .search-bar .stats { text-align: right; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <h1>🌿 FarmIOT <span class="subtitle">Smart Agriculture</span></h1>
        </div>
        <div class="user-profile" id="userProfile">
            <div class="avatar" id="avatarBtn" onclick="toggleDropdown()">
                <span id="avatarText">👤</span>
                <img id="avatarImg" style="display:none;" alt="Profile">
            </div>
            <div class="user-dropdown" id="userDropdown">
                <div class="user-info">
                    <div class="name" id="dropdownName">User</div>
                    <div class="email" id="dropdownEmail">user@example.com</div>
                </div>
                <div class="divider"></div>
                <button class="dropdown-item danger" onclick="logoutUser()">🚪 Sign Out</button>
            </div>
        </div>
    </div>

    <!-- AUTH CARD (Hidden after login) -->
    <div id="authSection">
        <div class="card auth-card" id="signinCard" style="background:rgba(17,24,39,0.9);padding:32px;border-radius:20px;border:1px solid rgba(255,255,255,0.06);max-width:420px;margin:0 auto;">
            <h2 style="font-size:20px;text-align:center;">🌿 Welcome to FarmIOT</h2>
            <p style="text-align:center;color:#6b7280;font-size:14px;margin-bottom:20px;">Sign in to manage your smart farm devices</p>
            <div id="googleBtn" style="display:flex;justify-content:center;"></div>
            <div style="display:flex;align-items:center;margin:14px 0;color:#374151;font-size:12px;">
                <span style="flex:1;border-bottom:1px solid rgba(255,255,255,0.06);"></span>
                <span style="padding:0 12px;">or</span>
                <span style="flex:1;border-bottom:1px solid rgba(255,255,255,0.06);"></span>
            </div>
            <div style="text-align:left;">
                <div style="display:flex;gap:4px;background:rgba(255,255,255,0.03);border-radius:8px;padding:3px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.04);">
                    <button class="active" id="loginTab" onclick="setAuthMode('login')" style="flex:1;padding:6px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#6b7280;font-family:inherit;">Sign In</button>
                    <button id="registerTab" onclick="setAuthMode('register')" style="flex:1;padding:6px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#6b7280;font-family:inherit;">Register</button>
                </div>
                <form id="authForm" onsubmit="handleAuthSubmit(event)">
                    <div class="form-group">
                        <label>📧 Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>🔒 Password</label>
                        <input type="password" id="password" placeholder="Enter your password" minlength="6" required>
                    </div>
                    <div class="form-group" id="confirmGroup" style="display:none;">
                        <label>🔒 Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;padding:10px;justify-content:center;">Sign In</button>
                </form>
                <div id="authStatus" style="margin-top:10px;padding:8px;border-radius:8px;font-size:13px;display:none;"></div>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardContent" class="hidden">
        <!-- Search & Controls -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search devices by name or ID..." oninput="filterDevices()">
            <button class="btn btn-primary btn-sm" onclick="scanForHubs()">🔍 Scan</button>
            <button class="btn btn-secondary btn-sm" onclick="loadDevices()">🔄 Refresh</button>
            <span id="bleStatus" class="ble-status disconnected">⚪ Offline</span>
            <span class="stats" id="deviceCount"></span>
        </div>

        <!-- Device Grid -->
        <div id="deviceGrid" class="device-grid">
            <div class="loading"><div class="spinner"></div>Loading devices...</div>
        </div>
    </div>
</div>

<!-- CONFIG MODAL -->
<div class="modal" id="configModal">
    <div class="modal-content">
        <h2>⚙️ Configure Hub</h2>
        <div class="sub" id="configHubInfo">
            Configuring: <strong id="configHubId">—</strong>
            <span id="configHubStatus" style="color:#6b7280;font-size:12px;display:block;margin-top:4px;"></span>
        </div>
        <div class="form-group">
            <label>📶 WiFi SSID</label>
            <input type="text" id="configSSID" placeholder="Enter WiFi SSID" required>
        </div>
        <div class="form-group">
            <label>🔑 WiFi Password</label>
            <input type="password" id="configPassword" placeholder="Enter WiFi password" required>
        </div>
        <div class="form-group">
            <label>🏷️ Device Name</label>
            <input type="text" id="configDeviceName" placeholder="My Hub">
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal('configModal')">Cancel</button>
            <button class="btn btn-primary" id="configSaveBtn" onclick="saveConfig()">💾 Save</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script>
    const API_BASE = window.location.origin;
    let token = localStorage.getItem('token') || null;
    let user = JSON.parse(localStorage.getItem('user') || 'null');
    let authMode = 'login';
    let currentConfigHubId = null;
    let currentBleDevice = null;
    let currentBleCharacteristic = null;
    let isConnected = false;
    let autoRefreshInterval = null;
    let isFirstLoad = true;
    let allDevices = [];

    const BLE_SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const BLE_CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // ===== TOAST =====
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + type + ' show';
        clearTimeout(toast._hide);
        toast._hide = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ===== BLE STATUS =====
    function updateBleStatus(status, message) {
        const el = document.getElementById('bleStatus');
        el.className = 'ble-status ' + status;
        const icons = { connected: '🟢', disconnected: '⚪', scanning: '🔄' };
        el.textContent = (icons[status] || '⚪') + ' ' + (message || status);
    }

    // ===== API =====
    async function apiRequest(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
        return response.json();
    }

    // ===== AUTH =====
    function setAuthMode(m) {
        authMode = m;
        document.getElementById('loginTab').classList.toggle('active', m === 'login');
        document.getElementById('registerTab').classList.toggle('active', m === 'register');
        document.getElementById('confirmGroup').style.display = m === 'register' ? 'block' : 'none';
        document.getElementById('submitBtn').textContent = m === 'login' ? 'Sign In' : 'Register';
    }

    async function handleAuthSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const confirm = document.getElementById('confirmPassword').value.trim();
        const status = document.getElementById('authStatus');
        const btn = document.getElementById('submitBtn');

        if (!email || !password) {
            status.style.display = 'block'; status.className = 'error';
            status.textContent = '❌ Please fill in all fields'; return;
        }
        if (authMode === 'register' && password !== confirm) {
            status.style.display = 'block'; status.className = 'error';
            status.textContent = '❌ Passwords do not match'; return;
        }

        btn.disabled = true; btn.innerHTML = '⏳ Processing...'; status.style.display = 'none';

        try {
            const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
            const data = await apiRequest(endpoint, { method: 'POST', body: JSON.stringify({ email, password }) });

            if (data.success) {
                token = data.token; user = data.user;
                localStorage.setItem('token', token); localStorage.setItem('user', JSON.stringify(user));
                showUser(user);
                showToast(authMode === 'login' ? '✅ Welcome back!' : '✅ Account created!', 'success');
                loadDashboard();
            } else {
                status.style.display = 'block'; status.className = 'error';
                status.textContent = '❌ ' + (data.error || 'Something went wrong');
                showToast('❌ ' + data.error, 'error');
            }
        } catch (error) {
            status.style.display = 'block'; status.className = 'error';
            status.textContent = '❌ Network error: ' + error.message;
            showToast('❌ Network error', 'error');
        }

        btn.disabled = false; btn.innerHTML = authMode === 'login' ? 'Sign In' : 'Register';
    }

    function initGoogleSSO() {
        google.accounts.id.initialize({
            client_id: '472048491207-hofjvaisdj9vnaglutb9kd23ci948jc5.apps.googleusercontent.com',
            callback: async (response) => {
                try {
                    const result = await apiRequest('/api/auth/google', {
                        method: 'POST',
                        body: JSON.stringify({ id_token: response.credential })
                    });
                    if (result.success) {
                        token = result.token; user = result.user;
                        localStorage.setItem('token', token); localStorage.setItem('user', JSON.stringify(user));
                        showUser(user);
                        showToast('✅ Welcome, ' + user.name + '!', 'success');
                        loadDashboard();
                    } else showToast('❌ ' + result.error, 'error');
                } catch (error) { showToast('❌ Login failed: ' + error.message, 'error'); }
            }
        });
        google.accounts.id.renderButton(document.getElementById('googleBtn'),
            { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill' }
        );
    }

    function showUser(userData) {
        document.getElementById('signinCard').style.display = 'none';
        document.getElementById('dashboardContent').classList.remove('hidden');
        document.getElementById('avatarText').style.display = 'none';
        const img = document.getElementById('avatarImg');
        img.style.display = 'block';
        img.src = userData.picture || '';
        document.getElementById('dropdownName').textContent = userData.name || 'User';
        document.getElementById('dropdownEmail').textContent = userData.email;
        // Remove signout from dropdown
    }

    function logoutUser() {
        localStorage.removeItem('token'); localStorage.removeItem('user');
        token = null; user = null;
        document.getElementById('signinCard').style.display = 'block';
        document.getElementById('dashboardContent').classList.add('hidden');
        document.getElementById('avatarText').style.display = 'block';
        document.getElementById('avatarImg').style.display = 'none';
        document.getElementById('userDropdown').classList.remove('active');
        showToast('✅ Signed out');
        if (currentBleDevice?.gatt) try { currentBleDevice.gatt.disconnect(); } catch(e) {}
        isConnected = false;
        updateBleStatus('disconnected');
        if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
    }

    function toggleDropdown() {
        document.getElementById('userDropdown').classList.toggle('active');
    }

    // Close dropdown on click outside
    document.addEventListener('click', (e) => {
        const profile = document.getElementById('userProfile');
        if (!profile.contains(e.target)) {
            document.getElementById('userDropdown').classList.remove('active');
        }
    });

    function checkSession() {
        if (token && user) { showUser(user); loadDashboard(); }
    }

    // ===== DASHBOARD =====
    async function loadDashboard() {
        await loadDevices();
        autoReconnectBle();
        if (autoRefreshInterval) { clearInterval(autoRefreshInterval); }
        autoRefreshInterval = setInterval(() => {
            if (token && user) loadDevices();
        }, 15000);
    }

    // ===== FILTER DEVICES =====
    function filterDevices() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.device-card');
        cards.forEach(card => {
            const name = card.dataset.name?.toLowerCase() || '';
            const id = card.dataset.id?.toLowerCase() || '';
            const match = name.includes(query) || id.includes(query);
            card.style.display = match ? '' : 'none';
        });
        // Update visible count
        const visible = document.querySelectorAll('.device-card:not([style*="display: none"])').length;
        document.getElementById('deviceCount').textContent = `(${visible} devices shown)`;
    }

    // ===== LOAD DEVICES =====
    async function loadDevices() {
        const grid = document.getElementById('deviceGrid');
        const countEl = document.getElementById('deviceCount');
        
        if (isFirstLoad) {
            grid.innerHTML = '<div class="loading"><div class="spinner"></div>Loading devices...</div>';
        }
        
        try {
            const response = await fetch(`${API_BASE}/api/hubs`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!response.ok) throw new Error('Failed to load devices');
            const hubs = await response.json();
            allDevices = hubs;

            const claimed = hubs.filter(h => h.user_id === user?.id || h.user_id === user?.email);
            const unclaimed = hubs.filter(h => h.user_id === null && h.status === 'online');

            const total = claimed.length + unclaimed.length;
            const online = hubs.filter(h => h.status === 'online').length;
            countEl.textContent = `${total} devices · ${online} online`;

            let html = '';

            // Claimed devices
            if (claimed.length > 0) {
                claimed.forEach(hub => {
                    const status = hub.status || 'offline';
                    const statusClass = status === 'online' ? 'online' : status === 'pairing' ? 'pairing' : 'offline';
                    const icon = status === 'online' ? '🌿' : '📡';
                    const soil = hub.soil_moisture || '--';
                    const ip = hub.ip_address || 'No IP';
                    const id = hub.hub_id;
                    const name = hub.device_name || hub.hub_id;
                    
                    html += `
                        <div class="device-card" data-name="${name.toLowerCase()}" data-id="${id.toLowerCase()}">
                            <div class="card-top">
                                <div class="device-icon">${icon}</div>
                                <div>
                                    <span class="badge ${statusClass}"><span class="dot"></span> ${status}</span>
                                </div>
                            </div>
                            <div class="device-name">${name}</div>
                            <div class="device-id">🆔 ${id}</div>
                            <div class="device-status">
                                <span class="detail">📡 ${ip}</span>
                            </div>
                            <div class="device-soil">
                                <span class="value">${soil}</span>
                                <span class="unit">%</span>
                                <div class="mini-bar">
                                    <div class="fill" style="width:${Math.min(soil, 100)}%;"></div>
                                </div>
                            </div>
                            <div class="device-details">
                                <span class="detail">📶 ${hub.last_seen ? new Date(hub.last_seen).toLocaleTimeString() : 'Never'}</span>
                            </div>
                            <div class="device-actions">
                                <button class="btn btn-secondary btn-sm" onclick="openConfig('${id}')" title="Configure">⚙️</button>
                                <button class="btn btn-secondary btn-sm" onclick="rebootHub('${id}')" title="Reboot">🔄</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteHub('${id}')" title="Delete">🗑️</button>
                            </div>
                        </div>
                    `;
                });
            }

            // Unclaimed discovered hubs
            if (unclaimed.length > 0) {
                html += `<div style="grid-column:1/-1;padding:8px 0 4px;font-size:12px;color:#6b7280;border-top:1px solid rgba(255,255,255,0.06);">🔍 Discovered (Click to Claim)</div>`;
                unclaimed.forEach(hub => {
                    html += `
                        <div class="discovered-card" style="grid-column:1/-1;">
                            <div class="info">
                                <span class="icon">📡</span>
                                <div>
                                    <div style="font-weight:600;">${hub.device_name || hub.hub_id}</div>
                                    <div style="font-size:11px;color:#6b7280;">${hub.ip_address || 'No IP'} · <span class="badge online"><span class="dot"></span> online</span></div>
                                </div>
                            </div>
                            <button class="btn btn-success btn-sm" onclick="claimHub('${hub.hub_id}')">📥 Claim</button>
                        </div>
                    `;
                });
            }

            if (!html) {
                html = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <div class="icon">🌿</div>
                        <div class="title">No devices yet</div>
                        <div class="sub">Set up your ESP32 hub and it will appear here automatically.</div>
                    </div>
                `;
            }

            grid.innerHTML = html;
            isFirstLoad = false;

        } catch (error) {
            grid.innerHTML = `
                <div style="grid-column:1/-1;text-align:center;padding:20px;color:#f87171;">
                    ❌ ${error.message || 'Failed to load devices'}
                    <br><br>
                    <button class="btn btn-secondary btn-sm" onclick="loadDevices()">🔄 Retry</button>
                </div>
            `;
        }
    }

    // ===== CLAIM HUB =====
    async function claimHub(hubId) {
        showToast('📥 Claiming hub...', 'warning');
        try {
            const result = await apiRequest('/api/hubs/claim', {
                method: 'POST',
                body: JSON.stringify({ hub_id: hubId })
            });
            if (result.success) {
                showToast('✅ Hub claimed!', 'success');
                loadDevices();
            } else {
                showToast('❌ ' + (result.error || 'Failed'), 'error');
            }
        } catch (error) {
            showToast('❌ Error: ' + error.message, 'error');
        }
    }

    // ===== BLE FUNCTIONS =====
    async function autoReconnectBle() {
        try {
            if (!navigator.bluetooth) return;
            const devices = await navigator.bluetooth.getDevices();
            if (devices.length === 0) { updateBleStatus('disconnected'); return; }

            let found = null;
            for (const d of devices) {
                try {
                    const s = await d.gatt.connect();
                    const services = await s.getPrimaryServices();
                    for (const svc of services) {
                        if (svc.uuid === BLE_SERVICE_UUID) { found = d; break; }
                    }
                    if (found) break;
                    await d.gatt.disconnect();
                } catch (e) {}
            }

            if (!found) { updateBleStatus('disconnected'); return; }
            await connectBleDevice(found);
        } catch (error) {
            updateBleStatus('disconnected');
        }
    }

    async function connectBleDevice(device) {
        try {
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(BLE_SERVICE_UUID);
            const characteristic = await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);
            currentBleDevice = device;
            currentBleCharacteristic = characteristic;
            isConnected = true;
            updateBleStatus('connected', device.name || 'Connected');
            return true;
        } catch (error) {
            isConnected = false;
            updateBleStatus('disconnected');
            return false;
        }
    }

    async function scanForHubs() {
        updateBleStatus('scanning', 'Scanning...');
        showToast('🔍 Scanning for BLE hubs...', 'warning');
        try {
            if (!navigator.bluetooth) {
                showToast('❌ Web Bluetooth not supported. Use Chrome/Edge.', 'error');
                updateBleStatus('disconnected');
                return;
            }
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: [BLE_SERVICE_UUID] }],
                optionalServices: [BLE_SERVICE_UUID]
            });
            if (!device) { showToast('❌ No devices found', 'error'); updateBleStatus('disconnected'); return; }
            await connectBleDevice(device);
            showToast('✅ Connected to ' + (device.name || 'device'), 'success');
            // After BLE connect, check if we need to show config
            currentConfigHubId = device.name || 'FarmIOT_Hub_001';
            document.getElementById('configHubId').textContent = currentConfigHubId;
            document.getElementById('configHubStatus').textContent = '📡 Connected via Bluetooth';
            document.getElementById('configSSID').value = '';
            document.getElementById('configPassword').value = '';
            document.getElementById('configDeviceName').value = currentConfigHubId;
            openModal('configModal');
        } catch (error) {
            updateBleStatus('disconnected');
            showToast('❌ Scan failed: ' + error.message, 'error');
        }
    }

    // ===== CONFIG =====
    async function saveConfig() {
        const ssid = document.getElementById('configSSID').value.trim();
        const password = document.getElementById('configPassword').value.trim();
        if (!ssid || !password) {
            showToast('❌ WiFi SSID and Password required', 'error');
            return;
        }

        const btn = document.getElementById('configSaveBtn');
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Sending...';
        document.getElementById('configHubStatus').textContent = '📤 Sending...';

        try {
            const config = { ssid, password };
            const encoder = new TextEncoder();
            await currentBleCharacteristic.writeValue(encoder.encode(JSON.stringify(config)));
            showToast('✅ Config sent! ESP32 is connecting...', 'success');
            document.getElementById('configHubStatus').textContent = '✅ Sent!';
            setTimeout(() => {
                closeModal('configModal');
                loadDevices();
                if (currentBleDevice?.gatt) { currentBleDevice.gatt.disconnect(); }
                isConnected = false;
                updateBleStatus('disconnected');
            }, 2000);
        } catch (error) {
            showToast('❌ Failed: ' + error.message, 'error');
        }
        btn.disabled = false; btn.innerHTML = '💾 Save';
    }

    async function openConfig(hubId) {
        currentConfigHubId = hubId;
        document.getElementById('configHubId').textContent = hubId;
        document.getElementById('configHubStatus').textContent = 'Loading...';
        document.getElementById('configSSID').value = '';
        document.getElementById('configPassword').value = '';
        document.getElementById('configDeviceName').value = hubId;

        try {
            const data = await apiRequest(`/api/hubs/${hubId}/config`);
            if (data.config) {
                document.getElementById('configSSID').value = data.config.ssid || '';
                document.getElementById('configDeviceName').value = data.config.device_name || hubId;
            }
        } catch (e) {}
        document.getElementById('configHubStatus').textContent = 'Ready';
        openModal('configModal');
    }

    // ===== HUB MANAGEMENT =====
    async function rebootHub(hubId) {
        if (!confirm(`Reboot ${hubId}?`)) return;
        showToast('🔄 Rebooting...', 'warning');
        try {
            const result = await apiRequest(`/api/hubs/${hubId}/reboot`, { method: 'POST' });
            if (result.success) {
                showToast('✅ Reboot command sent', 'success');
                setTimeout(loadDevices, 3000);
            } else {
                showToast('❌ ' + (result.error || 'Failed'), 'error');
            }
        } catch (error) {
            showToast('❌ Error: ' + error.message, 'error');
        }
    }

    async function deleteHub(hubId) {
        if (!confirm(`Delete ${hubId}?`)) return;
        showToast('🗑️ Deleting...', 'warning');
        try {
            const result = await apiRequest(`/api/hubs/${hubId}`, { method: 'DELETE' });
            if (result.success) {
                showToast('✅ Hub deleted', 'success');
                loadDevices();
            } else {
                showToast('❌ ' + (result.error || 'Failed'), 'error');
            }
        } catch (error) {
            showToast('❌ Error: ' + error.message, 'error');
        }
    }

    // ===== MODAL =====
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    });

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
        initGoogleSSO();
        checkSession();
        setAuthMode('login');
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>FarmIOT - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #0a0e17;
            color: #fff;
        }
        button {
            padding: 12px 24px;
            background: #4ade80;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 5px;
        }
        pre {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 20px;
        }
        .error { color: #f87171; }
        .success { color: #4ade80; }
    </style>
</head>
<body>
    <h1>🚜 FarmIOT Test</h1>
    <p>Testing server endpoints...</p>
    
    <div>
        <button onclick="testEndpoint('/api/test')">Test GET /api/test</button>
        <button onclick="testRegister()">Test POST /api/auth/register</button>
        <button onclick="testEndpoint('/api/auth/register')">GET /api/auth/register</button>
    </div>
    
    <div id="result">
        <p>Click a button to test...</p>
    </div>

    <script>
        async function testEndpoint(url) {
            const result = document.getElementById('result');
            result.innerHTML = 'Loading...';
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                result.innerHTML = `
                    <div class="success">✅ Status: ${res.status}</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `
                    <div class="error">❌ Error: ${error.message}</div>
                `;
            }
        }

        async function testRegister() {
            const result = document.getElementById('result');
            result.innerHTML = 'Loading...';
            
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: 'test@example.com', 
                        password: 'test123' 
                    })
                });
                
                const data = await res.json();
                result.innerHTML = `
                    <div class="${res.ok ? 'success' : 'error'}">${res.ok ? '✅' : '❌'} Status: ${res.status}</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `
                    <div class="error">❌ Error: ${error.message}</div>
                `;
            }
        }
    </script>
</body>
</html>

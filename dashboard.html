<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmIOT Dashboard</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin: 10px auto; max-width: 400px; }
    .online { color: #4CAF50; }
    .offline { color: #f44336; }
  </style>
</head>
<body>
  <h1>🌱 FarmIOT</h1>
  <div class="card">
    <p>Sensor ESP32</p>
    <h2 id="sensorStatus" class="offline">● OFFLINE</h2>
  </div>
  <div class="card">
    <p>Soil Moisture</p>
    <h2 id="soilDisplay">--</h2>
  </div>
  <script>
    async function checkStatus() {
      const res = await fetch('/api/sensor/status');
      const data = await res.json();
      document.getElementById('sensorStatus').innerText = data.online ? '● ONLINE' : '● OFFLINE';
      document.getElementById('sensorStatus').className = data.online ? 'online' : 'offline';
    }
    async function checkSoil() {
      const res = await fetch('/api/sensor/soil');
      const data = await res.json();
      document.getElementById('soilDisplay').innerText = data.moisture || '--';
    }
    setInterval(checkStatus, 5000);
    setInterval(checkSoil, 5000);
    checkStatus();
    checkSoil();
  </script>
</body>
</html>

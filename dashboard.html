<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmIOT Dashboard</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin: 10px auto; max-width: 400px; border: 1px solid #333; }
    .online { color: #4CAF50; }
    .offline { color: #f44336; }
  </style>
</head>
<body>

  <h1>🚜 FarmIOT</h1>

  <div class="card">
    <p>ESP32 Status</p>
    <h2 id="statusBadge" class="offline">● OFFLINE</h2>
  </div>

  <div class="card">
    <p>Soil Moisture</p>
    <h2 id="soilDisplay">--%</h2>
  </div>

  <div class="card">
    <p>Last Update</p>
    <h3 id="lastUpdateDisplay" style="color:#888; font-size:16px;">Never</h3>
  </div>

  <script>
    async function checkStatus() {
      try {
        const res = await fetch('/api/esp32/status');
        const data = await res.json();
        
        const badge = document.getElementById('statusBadge');
        badge.innerText = data.online ? '● ONLINE' : '● OFFLINE';
        badge.className = data.online ? 'online' : 'offline';
      } catch (e) {
        console.error("❌ Status fetch failed:", e);
      }
    }

    async function checkSoil() {
      try {
        const res = await fetch('/api/esp32/soil');
        const data = await res.json();
        
        console.log("============================================");
        console.log("📡 [DASHBOARD] Fetched data at:", new Date().toLocaleTimeString());
        console.log("📦 [DASHBOARD] Raw moisture received from server:", data.moisture);

        // Convert raw ADC to percentage for display
        const raw = data.moisture || 0;
        const percent = Math.min(100, Math.max(0, (1 - (raw / 4095)) * 100));
        const displayPercent = Math.round(percent);

        console.log(`📊 [DASHBOARD] Calculated percentage: ${displayPercent}%`);
        console.log("============================================");

        document.getElementById('soilDisplay').innerText = displayPercent + '%';
        document.getElementById('lastUpdateDisplay').innerText = new Date().toLocaleTimeString();
      } catch (e) {
        console.error("❌ Soil fetch failed:", e);
        document.getElementById('soilDisplay').innerText = '--%';
      }
    }

    setInterval(checkStatus, 5000);
    setInterval(checkSoil, 5000);
    checkStatus();
    checkSoil();
  </script>

</body>
</html>
